<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Euro Coin Icon">
  <!-- Outer Rim / Coin Base -->
  <circle cx="32" cy="32" r="30" fill="#E58B00" />
  
  <!-- Inner Coin Surface (Gives a clean, subtle 2D layered depth) -->
  <circle cx="32" cy="32" r="26" fill="#FFAA00" />
  
  <!-- Inner Rim Contour -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#E58B00" stroke-width="2" opacity="0.6" />

  <!-- Bold, Modern Euro Symbol -->
  <!-- Top Arch -->
  <path d="M 42 21 C 38 17 28 17 24 23 C 20.5 28.2 20.5 35.8 24 41 C 28 47 38 47 42 43" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" />

  <!-- Top Crossbar -->
  <path d="M 17 28 L 34 28" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Bottom Crossbar -->
  <path d="M 17 36 L 32 36" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="4.5" 
        stroke-linecap="round" />
</svg>
