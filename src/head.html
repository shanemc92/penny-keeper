<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Everything is inline or a data: URL. The only outbound request is the
     homelab sync to data/penny-keeper-current.json, which is same-origin,
     hence connect-src 'self'. blob: is in img-src for the generated xlsx/CSV
     download URLs. frame-ancestors is deliberately absent - browsers ignore it
     in a meta CSP; it belongs in a response header, and homelab/server.js now
     sends it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Penny Keeper</title>
<meta name="description" content="Penny Keeper: plain-English money tools for an Irish household. Runs in your browser; nothing is uploaded.">
