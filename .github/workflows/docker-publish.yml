name: Publish homelab image

# Builds the self-hosted image and pushes it to ghcr.io so it can be pulled rather
# than built locally. The image serves the root index.html, which build.yml has just
# rebuilt from src/ - so this runs when "Build and test" finishes on main, not on the push
# itself (a commit pushed by a workflow with GITHUB_TOKEN does not start other workflows,
# and a push-triggered run could also race ahead of the rebuilt page).
on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    # only after a successful build of a push to main, or when started by hand
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # the only write scope this needs
    steps:
      - uses: actions/checkout@v4

      # arm64 covers the Pi / ARM boxes a lot of homelabs run on
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Penny Keeper (homelab)
            org.opencontainers.image.description=Self-hosted Penny Keeper with a JSON sync endpoint
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .                      # root: the image serves the root index.html
          file: homelab/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
