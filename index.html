/* View-only sort for the Budget tables. The underlying array keeps whatever manual
   order it has - this sorts a copy for display, so data-path indexes still point at
   the real records. */
const billSort = {bill:{col:null, dir:1}, savings:{col:null, dir:1}};
const BILL_COLS = {
  name:   b => String(b.name||'').toLowerCase(),
  freq:   b => FREQ[b.freq]||0,
  holder: b => String(b.holder||'').toLowerCase(),
  amount: b => num(b.amount),
  annual: b => annualOf(b),
  monthly:b => annualOf(b)/12,
  weekly: b => annualOf(b)/52,
  due:    b => b.nextDue || '9999'
};
function sortBills(kind, list){
  const st = billSort[kind];
  if(!st.col || !BILL_COLS[st.col]) return list;
  const key = BILL_COLS[st.col];
  return list.slice().sort((a,b)=>{
    const x = key(a), y = key(b);
    return (x<y ? -1 : x>y ? 1 : 0) * st.dir;
  });
}
function sortableTh(kind, col, label, cls){
  const st = billSort[kind];
  const on = st.col===col;
  const arrow = on ? (st.dir===1 ? ' ↑' : ' ↓') : '';
  return `<th class="${cls||''}" data-sort="${kind}.${col}" style="cursor:pointer;user-select:none"
    title="Click to sort by ${esc(label)}">${label}${arrow}</th>`;
}
function billTable(kind, title, sub, rows, holders, actualByName, totals){
  const isSav = kind==='savings';
  rows = sortBills(kind, rows);
  const templates = isSav ? COMMON_SAVINGS : COMMON_BILLS;
  const have = new Set(billsOfKind(kind).map(b=>b.name.toLowerCase()));
  const body = rows.map(b=>{
    const i = Y.bills.indexOf(b);
    const a = annualOf(b), act = actualByName[b.name];
    const due = nextDueFrom(b);
    const usage = act && act.monthlyBudget>0 ? act.monthlyActual/act.monthlyBudget*100 : null;
    /* the date typed in may be in the past (a monthly bill first dated last March); say when it is next due */
    const rolled = due && b.nextDue && iso(due)!==b.nextDue ? `<span class="hint" style="display:block;margin:2px 0 0">next: ${iso(due)}</span>` : '';
    return `<tr>
      <td class="first" data-label="Name"><input data-path="bills.${i}.name" value="${esc(b.name)}" aria-label="Name" style="min-width:150px"></td>
      <td class="n" data-label="Amount"><input class="num" style="text-align:right;width:104px" data-path="bills.${i}.amount" data-type="number" inputmode="decimal" value="${num(b.amount)||''}" placeholder="0.00" aria-label="Amount"></td>
      <td data-label="How often"><select data-path="bills.${i}.freq" aria-label="How often" style="min-width:118px">${Object.keys(FREQ).map(f=>`<option ${f===b.freq?'selected':''}>${f}</option>`).join('')}</select></td>
      <td data-label="Who pays"><select data-path="bills.${i}.holder" aria-label="Who pays" style="min-width:104px">${holders.map(h=>`<option ${h===b.holder?'selected':''}>${esc(h)}</option>`).join('')}</select></td>
      <td data-label="Next payment"><input type="date" data-path="bills.${i}.nextDue" value="${esc(b.nextDue||'')}" style="min-width:140px" aria-label="Next payment">${rolled}</td>
      <td class="n" data-label="Per month"><b>${fmt(a/12)}</b></td>
      <td class="n" data-label="Annual">${fmt(a)}</td>
      <td class="n" data-label="Weekly">${fmt(a/52)}</td>
      <td class="n" data-label="Actual /mo">${act?fmt(act.monthlyActual):'<span class="mut">-</span>'}</td>
      <td data-label="Budget used">${usage===null?'<span class="mut">-</span>':barHtml(usage)}</td>
      <td class="act">
        <button class="btn sm" data-move="${esc(b.id)}" title="Move to ${isSav?'Bills':'Savings & investments'}">${isSav?'&rarr; Bills':'&rarr; Savings'}</button>
        <button class="btn sm danger" data-del-bill="${esc(b.id)}" aria-label="Delete">x</button></td>
    </tr>`;
  }).join('');
  const chips = `<div class="chips" style="margin-top:8px">${templates.map(([n,f])=>
    `<button class="chip ${have.has(n.toLowerCase())?'on':''}" data-addbill="${esc(n)}|${f}|${kind}" ${have.has(n.toLowerCase())?'disabled style="opacity:.6"':''}>${have.has(n.toLowerCase())?'✓ ':'+ '}${esc(n)}</button>`).join('')}</div>`;
  return `<div class="card">
    ${cardHead(title+` <span class="pill">${rows.length}</span>`, sub,
      `<button class="btn primary" data-add="${kind}">+ Add ${isSav?'savings':'a bill'}</button>`)}
    ${rows.length ? `<div class="tw"><table class="stack-m">
      <thead><tr>${sortableTh(kind,'name',isSav?'Savings for':'Bill')}${sortableTh(kind,'amount','Amount','n')}${sortableTh(kind,'freq','How often')}${sortableTh(kind,'holder','Who pays')}
        ${sortableTh(kind,'due','Next payment')}${sortableTh(kind,'monthly','Per month','n')}
        ${sortableTh(kind,'annual','Annual','n')}${sortableTh(kind,'weekly','Weekly','n')}
        <th class="n">Actual /mo</th><th>Budget used</th><th></th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td>Total</td><td></td><td></td><td></td><td></td>
        <td class="n">${fmt(totals.monthly)}</td>
        <td class="n">${fmt(totals.annual)}</td><td class="n">${fmt(totals.weekly)}</td>
        <td colspan="3"></td></tr></tfoot>
    </table></div>`
    : emptyState(isSav?'🐖':'🧾', isSav?'Nothing put aside yet':'No bills yet',
        isSav?'Tap one of the ideas below, or add your own.':'Tap the common Irish bills below to add them, then fill in the amounts - or add your own.')}
    <details class="more" ${rows.length?'':'open'}><summary>⚡ Quick add common ${isSav?'savings':'Irish bills'}</summary>${chips}</details>
    ${rows.length?`<div class="row" style="margin-top:10px"><button class="btn sm ghost" data-export="${kind}">Export CSV</button></div>`:''}
  </div>`;
}

function barHtml(usePct){
  const p = clamp(usePct,0,160);
  const w = p/160*100;
  const over = Math.round(usePct) > 100;   // 100.00000000000001 is on budget, not over it
  return `<div class="bar" title="${usePct.toFixed(0)}% of budget">
    <i class="${over?'over':'under'}" style="width:${w}%"></i>
    <b style="left:${100/160*100}%"></b>
    <em>${usePct>999?'-':Math.round(usePct)+'%'}</em></div>`;
}

/* ---------------- loans ---------------- */
function renderLoans(el){
  if(!Y.loans.length){
    el.innerHTML = `<div class="card">${emptyState('💳','No loans yet',

  }
  /* each schedule is a full amortisation run, so work them out once here and reuse
     them in the rows, the summary and the chart below */
  const schedules = Y.loans.map(l=>{
    const prop = amortise(l,true);
    return {orig: amortise(l,false), prop, pos: loanPosition(l, prop)};
  });
  el.innerHTML = Y.loans.map((l,i)=>{
    const orig = schedules[i].orig, prop = schedules[i].prop, pos = schedules[i].pos;

    return `<div class="card">

      <div class="grid g4">

      <div class="grid g4">
        <label class="f"><span>Current repayment</span><input class="num" data-path="loans.${i}.repayment" data-type="number" value="${num(l.repayment)}"></label>
        <label class="f"><span>Proposed repayment</span><input class="num" data-path="loans.${i}.proposedRepayment" data-type="number" value="${num(l.proposedRepayment)}"></label>
        <label class="f"><span>Overpayment starts</span><input type="date" data-path="loans.${i}.proposedStart" value="${esc(l.proposedStart||'')}"></label>
        <label class="f"><span>Target end date</span><input type="date" data-path="loans.${i}.endDate" value="${esc(l.endDate||'')}"></label>
      </div>
      ${calc? `<div class="note">To clear by the target date the repayment would need to be <b>${fmt(calc)}</b> per ${esc(String(l.freq).toLowerCase().replace('ly',''))}.</div>`:''}
      ${l.proposedStart? `<div class="note">Normal repayments up to ${esc(l.proposedStart)}, then ${fmt(num(l.proposedRepayment)||num(l.repayment))} from that date on.</div>`:''}

      <div class="grid g4" style="margin:12px 0">
        <div class="kpi"><div class="lbl">Owed today</div><div class="val">${fmt0(pos.balance)}</div>
          <div class="sub">${pos.cleared?'cleared':'+ '+fmt0(pos.remainingInterest)+' interest to come'}</div></div>
        <div class="kpi"><div class="lbl">Still to pay</div><div class="val">${fmt0(pos.toPay)}</div>
          <div class="sub">${pos.payments} payment${pos.payments===1?'':'s'} left${pos.next?', next '+esc(pos.next):''}</div></div>
        <div class="kpi"><div class="lbl">Interest - current</div><div class="val">${fmt0(orig.interest)}</div><div class="sub">${orig.payments} payments to ${orig.end}</div></div>
        <div class="kpi"><div class="lbl">Interest - proposed</div><div class="val">${fmt0(prop.interest)}</div><div class="sub">${prop.payments} payments to ${prop.end}</div></div>
        <div class="kpi"><div class="lbl">Interest saved</div><div class="val ${saveInt>0?'pos':''}">${fmt0(saveInt)}</div><div class="sub">${sooner>0?sooner+' payments sooner':'no change'}</div></div>
        <div class="kpi"><div class="lbl">Total to pay</div><div class="val">${fmt0(prop.paid)}</div><div class="sub">was ${fmt0(orig.paid)}</div></div>
      </div>

      <div class="chartbox" style="height:280px"><canvas id="cLoan${i}"></canvas></div>
      ${legendHtml([{label:'Current schedule',color:PALETTE[2]},{label:'Proposed',color:PALETTE[0]}])}

      <details style="margin-top:10px"><summary>Schedule &amp; one-off overpayments (${prop.rows.length} rows)</summary>
        <div class="tw" style="max-height:340px;overflow:auto;margin-top:8px"><table>
          <thead><tr><th class="n">#</th><th>Date</th><th class="n">Opening</th><th class="n">Interest</th>
            <th class="n">Principal</th><th class="n">Payment</th><th class="n">Balance</th><th class="n">Extra</th></tr></thead>

  wireFields(el);

  $$('[data-del-loan]',el).forEach(x=> x.onclick=()=>{ Y.loans.splice(+x.dataset.delLoan,1); save(); render(); });
  $$('[data-extra]',el).forEach(x=> x.onchange=()=>{
    const [li,n] = x.dataset.extra.split('.');
    const l = Y.loans[+li]; l.extras = l.extras||{};
    const v = num(x.value);
    if(v) l.extras[n]=v; else delete l.extras[n];
    save(); render();
  });
  $$('[data-export-loan]',el).forEach(x=> x.onclick=()=>{
    const l = Y.loans[+x.dataset.exportLoan];
    downloadCSV(slug(l.name)+'-schedule.csv', loanCSV(l));
  });
  Y.loans.forEach((l,i)=> chart(()=>{
    const o = schedules[i].orig, p = schedules[i].prop;
    const n = Math.max(o.rows.length, p.rows.length);
    const labels = Array.from({length:n},(_,k)=> (o.rows[k]||p.rows[k]).date.slice(0,7));
    const pad = (rows)=> Array.from({length:n},(_,k)=> rows[k]? rows[k].balance : 0);
    lineChart($('#cLoan'+i), labels, [
      {name:'Current', color:PALETTE[2], values:pad(o.rows)},
      {name:'Proposed', color:PALETTE[0], values:pad(p.rows), fill:true}
    ]);
  }));
}
function addLoan(){

}

/* ---------------- mortgage ---------------- */
function renderMortgage(el){
  const list = Y.mortgages || (Y.mortgages = []);
  if(!list.length){
    el.innerHTML = `<div class="card">${emptyState('🏡','No mortgage yet',
      'Add your mortgage to see your balance, what happens when your fixed rate ends, and how much you save by overpaying. Have your offer letter or latest statement to hand.',
      '<button class="btn primary lg" id="addMortgage">+ Add my mortgage</button>')}</div>`;
    $('#addMortgage').onclick = addMortgage;
    return;
  }
  /* Statements and lump sums get entered in whatever order you find them, but they only
     make sense read down the page in date order - and the engine sorts them anyway, so
     an unsorted table just disagrees with the schedule below it. Sort the real arrays
     rather than a copy, because the row inputs address records by index. A row whose
     date has been cleared sorts last instead of jumping to the top mid-edit. */
  const byDate = (a,b)=>{
    const x = (a && a.date) || '9999', y = (b && b.date) || '9999';
    return x < y ? -1 : x > y ? 1 : 0;
  };
  list.forEach(m=>{
    if(Array.isArray(m.statements)) m.statements.sort(byDate);
    if(Array.isArray(m.lumps)) m.lumps.sort(byDate);
  });

  /* each of these is a full run through the life of the mortgage, so do them once
     here and reuse them in the KPIs, the rate table, the chart and the schedule */
  const calcs = list.map(m=>{
    const sch = mortgageSchedule(m);
    return {sch, base: mortgageSchedule(m,{noExtra:true}), pos: mortgagePosition(m,sch),
            warn: fixedOverpayWarnings(m, sch)};
  });

  el.innerHTML = list.map((m,i)=>{
    const sch = calcs[i].sch, base = calcs[i].base, pos = calcs[i].pos, warn = calcs[i].warn;
    const term = clamp(Math.round(num(m.termMonths)),0,1200);
    const rs = mortRates(m);
    const savedInt = round2(base.interest - sch.interest);
    const sooner = base.payments - sch.payments;
    const outlay = pos.outlay;
    /* the first actual payment on or after the step - statement rows carry no payment,
       so landing on one shows a repayment of nothing, which a rate starting in the
       drawdown month otherwise does every time */
    const stepAt = from =>{
      const d = parseDate(from); if(!d) return null;
      return sch.rows.find(r=> !r.statement && parseDate(r.date) >= d) || null;
    };
    return `<div class="card">
      <div class="row" style="margin-bottom:10px">
        <label class="f" style="flex:1;min-width:150px"><span>Mortgage</span>
          <input data-path="mortgages.${i}.name" value="${esc(m.name)}"></label>
        <label class="f" style="flex:1;min-width:110px"><span>Lender</span>
          <input data-path="mortgages.${i}.lender" value="${esc(m.lender||'')}" placeholder="AIB"></label>
        <button class="btn sm danger" data-del-mortgage="${i}" title="Remove">x</button>
      </div>
      <h3 class="sect">The mortgage</h3>
      <div class="grid g4">
        <label class="f"><span>Amount borrowed</span><input class="num" data-path="mortgages.${i}.principal" data-type="number" value="${num(m.principal)}"></label>
        <label class="f"><span>Drawdown date</span><input type="date" data-path="mortgages.${i}.startDate" value="${esc(m.startDate||'')}"></label>
        <label class="f"><span>Term - years</span><input class="num" data-term="${i}.years" value="${Math.floor(term/12)}"></label>
        <label class="f"><span>Term - extra months</span><input class="num" data-term="${i}.months" value="${term%12}"></label>
        <label class="f"><span>Property value</span><input class="num" data-path="mortgages.${i}.propertyValue" data-type="number" value="${num(m.propertyValue)}"></label>
      </div>
      <h3 class="sect">Overpaying? ${ttHtml('Paying more than you have to shortens the mortgage and cuts the interest. Enter a monthly amount and the date it starts.')}</h3>
      <div class="grid g4">
        <label class="f"><span>Overpayment / month</span><input class="num" data-path="mortgages.${i}.overpayMonthly" data-type="number" value="${num(m.overpayMonthly)}"></label>
        <label class="f"><span>Overpayment starts</span><input type="date" data-path="mortgages.${i}.overpayFrom" value="${esc(m.overpayFrom||'')}"></label>
      </div>
      <div>
      <h3 class="sect">Lender details ${ttHtml('Optional. Fill these in from your statement for a more accurate picture, or leave them as they are.')}</h3>
      <div class="grid g4">
        <label class="f"><span>Repayment now (statement)</span><input class="num" data-path="mortgages.${i}.repayment" data-type="number" value="${num(m.repayment)}"></label>
        <label class="f"><span>Insurance / month</span><input class="num" data-path="mortgages.${i}.insuranceMonthly" data-type="number" value="${num(m.insuranceMonthly)}"></label>
        <label class="f"><span>Interest charged</span><select data-path="mortgages.${i}.basis">${MORT_BASIS_ORDER.map(b=>
          `<option value="${b}" ${b===basisOf(m)?'selected':''}>${MORT_BASES[b]}</option>`).join('')}</select></label>
        <label class="f"><span>Fixed overpay allowance %</span><input class="num" data-path="mortgages.${i}.allowancePct" data-type="number" step="0.5" value="${num(m.allowancePct)}"></label>
      </div></div>
      <div class="note">${term? Math.floor(term/12)+'y '+(term%12)+'m term':'Set a term'}${
        pos.originalEnd? ', contracted to end '+esc(pos.originalEnd):''}. Leave the repayment at 0 to have it
        worked out from the rate and the term - set it to the figure on your statement once you are mid-mortgage,
        because after overpayments the lender keeps collecting the contractual amount rather than a re-solved one.</div>

      <div class="grid g4" style="margin:12px 0">
        <div class="kpi"><div class="lbl">Balance today</div><div class="val">${fmt0(pos.balance)}</div>
          <div class="sub">${pos.cleared?'cleared':'of '+fmt0(num(m.principal))+' borrowed'}</div></div>
        <div class="kpi"><div class="lbl">Repayment</div><div class="val">${fmt0(pos.nextPayment)}</div>
          <div class="sub">${ratePct(pos.rate)} ${esc(RATE_KINDS[pos.kind]||pos.kind||'')}${pos.next?', next '+esc(pos.next):''}</div></div>
        <div class="kpi"><div class="lbl">Leaves the account</div><div class="val">${fmt0(outlay)}</div>
          <div class="sub">${num(m.insuranceMonthly)>0? fmt0(pos.nextPayment)+' + '+fmt(num(m.insuranceMonthly))+' insurance' : 'no insurance with it'}</div></div>
        <div class="kpi"><div class="lbl">Interest still to pay</div><div class="val">${fmt0(pos.remainingInterest)}</div>
          <div class="sub">${fmt0(pos.paidInterest)} charged so far</div></div>
        <div class="kpi"><div class="lbl">Total cost of credit</div><div class="val">${fmt0(sch.interest)}</div>
          <div class="sub">${fmt0(num(m.principal)+sch.interest)} repaid in all</div></div>
        <div class="kpi"><div class="lbl">Paid off by</div><div class="val">${esc(sch.end?sch.end.slice(0,7):'-')}</div>
          <div class="sub">${pos.monthsSooner>0? pos.monthsSooner+' months early':'as contracted'}</div></div>
        <div class="kpi"><div class="lbl">Interest saved</div><div class="val ${savedInt>0?'pos':''}">${fmt0(savedInt)}</div>
          <div class="sub">${sooner>0? sooner+' payments sooner':'nothing overpaid'}</div></div>
        ${num(m.propertyValue)>0? `<div class="kpi"><div class="lbl">Loan to value</div><div class="val">${pct(pos.ltv)}</div>
          <div class="sub">on ${fmt0(num(m.propertyValue))}</div></div>`:''}
      </div>

      <h3 style="margin:16px 0 6px;font-size:14px">Interest rate schedule</h3>
      <div class="tw"><table>
        <thead><tr><th>From</th><th class="n">Rate %</th><th>Type</th><th>Until</th>
          <th class="n">Balance then</th><th class="n">Repayment</th><th></th></tr></thead>
        <tbody>${rs.length? rs.map((r,ri)=>{
          const idx = (m.rates||[]).indexOf(r), nxt = rs[ri+1], st = stepAt(r.from);
          return `<tr>
            <td><input type="date" data-path="mortgages.${i}.rates.${idx}.from" value="${esc(r.from||'')}" style="min-width:140px"></td>
            <td class="n"><input class="num" style="text-align:right;width:80px" data-path="mortgages.${i}.rates.${idx}.rate" data-type="number" step="0.01" value="${num(r.rate)}"></td>
            <td><select data-path="mortgages.${i}.rates.${idx}.kind">${Object.keys(RATE_KINDS).map(k=>
              `<option value="${k}" ${k===r.kind?'selected':''}>${RATE_KINDS[k]}</option>`).join('')}</select></td>
            <td class="mut">${nxt? esc(nxt.from):'end of term'}</td>
            <td class="n">${st? fmt0(st.opening):'-'}</td>
            <td class="n">${st? fmt0(st.payment):'-'}</td>
            <td class="act">${rs.length>1?`<button class="btn sm danger" data-del-rate="${i}.${idx}">x</button>`:''}</td></tr>`;
        }).join('') : `<tr><td colspan="7" class="empty">Add the rate you drew down on.</td></tr>`}</tbody>
      </table></div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" data-add-rate="${i}">+ Add rate change</button>
        <span class="note" style="margin:0">Each row runs from its date until the next one starts. Put the
          follow-on rate in now, dated the day your fix ends, and the repayment column tells you what it becomes.</span>
      </div>
      ${warn.length? `<div class="note" style="color:var(--warn);border-color:var(--warn)">
        The overpayments above go past the ${pct(num(m.allowancePct))} a year this fixed rate allows in
        ${warn.map(w=> esc(w.year)+' ('+fmt0(w.extra)+' against '+fmt0(w.allowed)+')').join(', ')}.
        That usually triggers a break funding fee, and the amount depends on funding rates on the day, so check
        your loan offer - nothing above accounts for one.</div>`:''}

      <div class="chartbox" style="height:280px"><canvas id="cMort${i}"></canvas></div>
      ${legendHtml([{label:'No overpayments',color:PALETTE[2]},{label:'Plan',color:PALETTE[0]}])}

      <h3 style="margin:16px 0 6px;font-size:14px">Statements <span class="pill">${(m.statements||[]).length}</span></h3>
      <div class="tw"><table>
        <thead><tr><th>Date</th><th class="n">Balance on it</th><th class="n">Adjustment</th>
          <th class="n">Interest on it</th><th class="n">We modelled</th>
          <th class="n">Paid on it</th><th class="n">We modelled</th><th>Note</th><th></th></tr></thead>
        <tbody>${(m.statements||[]).length? (m.statements||[]).map((s,si)=>{
          const row = sch.rows.find(r=> r.statement && s.date && r.date===iso(parseDate(s.date)));
          const adj = row ? row.adjust : null;
          const gap = (row && !blankish(s.interest)) ? round2(num(s.interest) - row.periodInterest) : null;
          return `<tr>
            <td><input type="date" data-path="mortgages.${i}.statements.${si}.date" value="${esc(s.date||'')}" style="min-width:140px"></td>
            <td class="n"><input class="num" style="text-align:right;width:100px" data-path="mortgages.${i}.statements.${si}.balance" value="${esc(s.balance??'')}" placeholder="off the statement"></td>
            <td class="n ${adj===null||!row?'mut':(Math.abs(adj)<50?'pos':'neg')}">${row? (adj? fmt(adj):'-') : '-'}</td>

function txnRows(){

    .slice(0,TXN_LIMIT)
    .map(({t,i})=>`<tr>
      <td>${esc(t.date)}</td><td>${esc(t.desc)}</td>
      <td class="n">${t.debit?fmt(num(t.debit)):''}</td>
      <td class="n pos">${t.credit?fmt(num(t.credit)):''}</td>
      <td class="n mut">${t.balance!==''&&t.balance!=null?fmt(num(t.balance)):''}</td>
      <td class="tap" data-txncat="${i}">${t.category? esc(t.category) : '<span class="mut">uncategorised</span>'}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="empty">No transactions.</td></tr>';
}
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  text = text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=ch;
    } else {
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(ch==='\r'){}
      else cell+=ch;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=> r.some(c=>String(c).trim()!==''));
}
function findCol(headers, ...keys){
  for(const k of keys){
    const i = headers.findIndex(h=> h.toLowerCase().replace(/[^a-z0-9]/g,'').includes(k));
    if(i>=0) return i;
  }
  return -1;
}
function importStatement(text, mode){
  const rows = parseCSV(text);
  if(rows.length<2){ toast('Could not read that CSV'); return; }
  const head = rows[0].map(h=>String(h).trim());
  const ci = {
    date: findCol(head,'date'),
    d1: findCol(head,'description1','description','details','narrative','reference'),
    d2: findCol(head,'description2'),
    d3: findCol(head,'description3'),
    debit: findCol(head,'debitamount','debit','withdrawal','moneyout','paidout'),
    credit: findCol(head,'creditamount','credit','deposit','moneyin','paidin'),
    amount: findCol(head,'amount','value'),
    balance: findCol(head,'balance'),
    type: findCol(head,'transactiontype','type')
  };
  if(ci.date<0 || ci.d1<0){ toast('Need at least a date and description column'); return; }
  const out=[];
  for(let r=1;r<rows.length;r++){
    const c = rows[r];
    const d = parseDate(normDate(c[ci.date]));
    if(!d) continue;
    let debit = ci.debit>=0? num(c[ci.debit]) : 0;
    let credit = ci.credit>=0? num(c[ci.credit]) : 0;
    if(ci.debit<0 && ci.credit<0 && ci.amount>=0){
      const a = num(c[ci.amount]);
      if(a<0) debit = Math.abs(a); else credit = a;
    }
    out.push({
      date: iso(d),
      desc: (c[ci.d1]||'').trim(),
      desc2: [ci.d2>=0?c[ci.d2]:'', ci.d3>=0?c[ci.d3]:''].filter(Boolean).join(' ').trim(),
      debit: debit||0, credit: credit||0,
      balance: ci.balance>=0? num(c[ci.balance]) : '',
      type: ci.type>=0? (c[ci.type]||'').trim() : '',
      category: ''
    });
  }
  if(!out.length){ toast('No rows recognised'); return; }
  if(mode==='replace') Y.txns = out;
  else {
    const seen = new Set(Y.txns.map(keyOf));
    let added=0;
    out.forEach(t=>{ if(!seen.has(keyOf(t))){ Y.txns.push(t); seen.add(keyOf(t)); added++; } });
    toast(added+' new transactions added ('+(out.length-added)+' duplicates skipped)');
  }
  const n = applyRules(false);
  save(); render();
  if(mode==='replace') toast(out.length+' transactions imported, '+n+' categorised');
}
const keyOf = t => [t.date,t.desc,t.debit,t.credit,t.balance].join('|');
function normDate(s){
  s = String(s||'').trim();
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`; }
  return s;
}

/* per-person savings breakdown - inputs live on the Budget tab, this is the read-out */
function savingsBreakdownCard(){
  const bands = Y.taxBands;
  const nets = Y.people.map(p=> calcTax(p,bands).netMonthly);
  const totalNet = nets.reduce((a,b)=>a+b,0);
  const st = billTotals('savings');
  const sp = savingsSplit();
  const accountsMonthly = (Y.savings.accounts||[]).reduce((s,a)=>s+num(a.monthly),0);

  const rows = sp.rows.map((r,i)=>`<tr>
      <td>${esc(r.name)}</td>
      <td class="n">${fmt(r.own)}</td>
      <td class="n">${fmt(r.joint)}</td>
      <td class="n"><b>${fmt(r.total)}</b></td>
      <td class="n">${fmt(r.total*12)}</td>
      <td class="n">${nets[i]? pct(r.total/nets[i]*100) : '<span class="mut">-</span>'}</td>
    </tr>`).join('');

  return `<div class="card">
    <h2>Savings &amp; investments per person</h2>
    <div class="grid g4" style="margin-bottom:12px">
      <div class="kpi"><div class="lbl">Put aside / month</div><div class="val pos">${fmt0(st.monthly)}</div>
        <div class="sub">${fmt0(st.annual)} a year</div></div>
      <div class="kpi"><div class="lbl">Joint</div><div class="val">${fmt0(sp.jointMonthly)}</div>
        <div class="sub">${fmt0(sp.jointEach)} each, split evenly</div></div>
      <div class="kpi"><div class="lbl">Individual</div><div class="val">${fmt0(st.monthly - sp.jointMonthly)}</div>
        <div class="sub">held in one name</div></div>
      <div class="kpi"><div class="lbl">Savings rate</div>
        <div class="val ${totalNet && st.monthly/totalNet>=0.2?'pos':''}">${totalNet?pct(st.monthly/totalNet*100):'-'}</div>
        <div class="sub">of combined net pay</div></div>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Person</th><th class="n">Own</th><th class="n">Share of joint</th>
        <th class="n">Total / month</th><th class="n">Annual</th><th class="n">% of their net pay</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" class="empty">Add people on the Take-home pay page, and savings on the Bills &amp; budget page.</td></tr>'}</tbody>
      <tfoot><tr><td>Total</td>
        <td class="n">${fmt(st.monthly - sp.jointMonthly - sp.unassigned)}</td>
        <td class="n">${fmt(sp.jointMonthly)}</td>
        <td class="n">${fmt(st.monthly - sp.unassigned)}</td>
        <td class="n">${fmt((st.monthly - sp.unassigned)*12)}</td>
        <td class="n">${totalNet?pct((st.monthly-sp.unassigned)/totalNet*100):''}</td></tr></tfoot>
    </table></div>
    <div class="note">Savings amounts are set on the Bills &amp; budget page. Joint amounts are shared evenly between people, regardless of income.</div>
    ${sp.unassigned>0?`<div class="note">${fmt(sp.unassigned)} a month is assigned to a holder who is not set up as a person, so it is not counted in the split.</div>`:''}
    ${Math.abs(accountsMonthly-st.monthly)>1?`<div class="note">The accounts below add up to ${fmt(accountsMonthly)} a month, which does not match the ${fmt(st.monthly)} committed on the Bills &amp; budget page.</div>`:''}
  </div>`;
}

const deductedTotal = a => Object.values((a && a.adjust) || {}).reduce((s,v)=>s+num(v),0);
/* Every dip into a savings account, listed so it can be corrected or removed.
   projectSavings() already subtracts these in the month they happened. */
function dipRows(s){
  const all = [];
  s.accounts.forEach((a,i)=> Object.entries(a.adjust||{}).forEach(([mk,v])=>
    all.push({i, name:a.name, mk, v:num(v)})));
  if(!all.length) return '';
  all.sort((x,y)=> x.mk<y.mk?1:-1);
  return `<details style="margin-top:10px"><summary>Money taken out (${all.length})</summary>
    <div class="tw" style="max-height:260px;overflow:auto;margin-top:8px"><table>
      <thead><tr><th>Month</th><th>Account</th><th class="n">Amount</th><th></th></tr></thead>
      <tbody>${all.map(d=>`<tr><td>${esc(d.mk)}</td><td>${esc(d.name)}</td>
        <td class="n neg">${fmt(d.v)}</td>
        <td class="act"><button class="btn sm danger" data-undip="${d.i}|${esc(d.mk)}">x</button></td></tr>`).join('')}</tbody>
    </table></div></details>`;
}

let histSel = null;   // view state only - never written to the year data
function renderHistory(el){
  const h = Y.history;
  const months = Array.from(new Set(h.map(r=>r.month))).sort();
  const cats = Array.from(new Set(h.map(r=>r.category))).filter(Boolean).sort();
  const grid = {};
  h.forEach(r=>{ grid[r.month] = grid[r.month]||{}; grid[r.month][r.category] = (grid[r.month][r.category]||0)+num(r.amount); });
  const catTotal = c => h.filter(r=>r.category===c).reduce((s,r)=>s+num(r.amount),0);

  el.innerHTML = `
  <div class="card">
    <h2>Historical bill payments</h2>
    <div class="note" style="margin-top:0">Actuals you have already paid, kept across years. Use it to sanity-check the budget you set for ${esc(Y.year)}.</div>
    <div class="row" style="margin:10px 0">
      <label class="f" style="width:130px"><span>Month</span><input type="month" id="hMonth" value="${monthKey(new Date())}"></label>
      <label class="f" style="width:180px"><span>Category</span><input list="catList2" id="hCat" placeholder="Electricity"></label>
      <label class="f" style="width:120px"><span>Amount</span><input class="num" id="hAmt" value=""></label>
      <button class="btn" id="hAdd">Add</button>
      <div class="spacer"></div>
      <button class="btn" id="hFromTxns">Build from transactions</button>
      <button class="btn" id="exportHistory">Export CSV</button>
      <label class="f" style="width:200px;margin:0"><span>Import CSV (replaces)</span>
        <input type="file" id="hImport" accept=".csv,text/csv"></label>
    </div>
    <datalist id="catList2">${Y.bills.map(b=>`<option value="${esc(b.name)}">`).join('')}</datalist>
  </div>

  ${cats.length?`<div class="card">
    <h2>Trend</h2>
    <div class="row" style="margin-bottom:8px">
      <label class="f" style="width:200px"><span>Category</span>
        <select id="hSel">${cats.map(c=>`<option ${c===(histSel||cats[0])?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
    </div>
    <div class="chartbox"><canvas id="cHist"></canvas></div>
  </div>`:''}

  <div class="card">
    <h2>Log <span class="pill">${h.length}</span></h2>
    <div class="tw" style="max-height:480px;overflow:auto"><table>
      <thead><tr><th>Month</th>${cats.map(c=>`<th class="n">${esc(c)}</th>`).join('')}<th class="n">Total</th></tr></thead>
      <tbody>${months.slice().reverse().map(m=>{
        const row = grid[m]||{};
        const tot = Object.values(row).reduce((a,b)=>a+b,0);
        return `<tr><td>${esc(m)}</td>${cats.map(c=>`<td class="n">${row[c]?fmt(row[c]):'<span class="mut">-</span>'}</td>`).join('')}
          <td class="n"><b>${fmt(tot)}</b></td></tr>`;
      }).join('') || `<tr><td colspan="${cats.length+2}" class="empty">Nothing logged yet.</td></tr>`}</tbody>
      <tfoot><tr><td>Average / month</td>${cats.map(c=>{
        const ms = months.filter(m=>grid[m]&&grid[m][c]!=null).length||1;
        return `<td class="n">${fmt(catTotal(c)/ms)}</td>`;
      }).join('')}<td></td></tr></tfoot>
    </table></div>
  </div>`;

  $('#hAdd').onclick = ()=>{
    const m = $('#hMonth').value, c = $('#hCat').value.trim(), a = num($('#hAmt').value);
    if(!m||!c){ toast('Month and category needed'); return; }
    Y.history.push({month:m, category:c, amount:a});
    save(); render();
  };
  $('#hFromTxns').onclick = ()=>{
    const seen = new Set(Y.history.map(r=>r.month+'|'+r.category));
    const agg = {};
    Y.txns.filter(t=>t.category && num(t.debit)>0).forEach(t=>{
      const k = t.date.slice(0,7)+'|'+t.category;
      agg[k] = (agg[k]||0)+num(t.debit);
    });
    let n=0;
    Object.entries(agg).forEach(([k,v])=>{
      if(seen.has(k)) return;
      const [month,category]=k.split('|');
      Y.history.push({month, category, amount:round2(v)}); n++;
    });
    save(); render(); toast(n+' months added from transactions');
  };
  $('#exportHistory').onclick = ()=> downloadCSV('history-'+yearLabel()+'.csv', historyCSV());
  $('#hImport').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      const rows = parseCSV(rd.result);
      e.target.value = '';
      if(!rows.length){ toast('Nothing in that file'); return; }
      const head = rows[0].map(h=>String(h).trim().toLowerCase());
      const iM = head.findIndex(h=>h.includes('month'));
      const iC = head.findIndex(h=>h.includes('categ'));
      const iA = head.findIndex(h=>h.includes('amount'));
      if(iM<0||iC<0||iA<0){ toast('Need Month, Category and Amount columns'); return; }
      const out = [];
      for(let r=1;r<rows.length;r++){
        const c = rows[r];
        const m = String(c[iM]||'').trim().slice(0,7);
        const cat = String(c[iC]||'').trim();
        if(!/^\d{4}-\d{2}$/.test(m) || !cat) continue;
        out.push({month:m, category:cat, amount:num(c[iA])});
      }
      if(!out.length){ toast('No usable rows - months need to look like 2026-03'); return; }
      if(Y.history.length && !confirm('Replace all '+Y.history.length+' existing history rows with '+out.length+' from this file?')) return;
      Y.history = out;
      save(); render();
      toast(out.length+' history rows imported');
    };
    rd.onerror = ()=>{ toast('Could not read that file'); e.target.value=''; };
    rd.readAsText(f);
  };
  const sel = $('#hSel');
  if(sel){
    sel.onchange = ()=>{ histSel = sel.value; render(); };
    chart(()=>{
      const c = histSel||cats[0];
      const ms = months.filter(m=>grid[m]&&grid[m][c]!=null);
      lineChart($('#cHist'), ms, [{name:c, color:PALETTE[0], values:ms.map(m=>grid[m][c]), fill:true}]);
    });
  }
}

/* swap an item with its neighbour; returns false at either end so callers can skip re-rendering */
function moveItem(arr, i, dir){
  const j = i + dir;
  if(j < 0 || j >= arr.length) return false;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  return true;
}

/* ---------------- electricity ---------------- */
function profileKpis(s){
  const pr = s.profile || [], mins = s.intervalMins||30;
  const perDay = pr.reduce((a,b)=>a+b,0);
  let hi = 0; pr.forEach((v,i)=>{ if(v>pr[hi]) hi=i; });
  const at = i => String(Math.floor(i*mins/60)).padStart(2,'0')+':'+String((i*mins)%60).padStart(2,'0');
  const share = v => pct(s.total ? v/s.total*100 : 0);
  return `
    <div class="kpi"><div class="lbl">Typical day</div><div class="val">${perDay.toFixed(1)}</div>
      <div class="sub">kWh</div></div>
    <div class="kpi"><div class="lbl">Busiest half hour</div><div class="val">${at(hi)}</div>
      <div class="sub">${(pr[hi]||0).toFixed(2)} kWh on average</div></div>
    <div class="kpi"><div class="lbl">Used at night</div><div class="val pos">${share(s.night)}</div>
      <div class="sub">cheapest rate</div></div>
    <div class="kpi"><div class="lbl">Used at peak</div><div class="val ${s.total&&s.peak/s.total>0.2?'neg':''}">${share(s.peak)}</div>
      <div class="sub">dearest rate</div></div>`;
}

    ${s && s.mprn && E.mprn && String(s.mprn).trim()!==String(E.mprn).trim()

    <div class="note">A year of half-hourly readings is around 17,500 rows. It is summarised in the browser and only the

  $$('[data-current]',el).forEach(x=> x.onchange=()=>{

    save(); render();
  });
  $('#exportOffers').onclick = ()=> downloadCSV('electricity-offers-'+yearLabel()+'.csv', offersCSV());
  if($('#exportUsage')) $('#exportUsage').onclick = ()=> downloadCSV('electricity-usage-'+yearLabel()+'.csv', usageCSV());

  /* offer comparison needs priced offers; usage and profile only need a summary */
  if(s && valid.length) chart(()=>{
    const sorted = valid.slice().sort((a,b)=>a.c.annual-b.c.annual);
    hBars($('#cOffers'), sorted.map(x=>x.o.name+(x.o.current?' (current)':'')), [
      {name:'Per year', color:PALETTE[0], values:sorted.map(x=>x.c.annual)}
    ]);
    hBars($('#cBands'), sorted.map(x=>x.o.name), [
      {name:'Day', color:PALETTE[1], values:sorted.map(x=>x.c.dayCost)},
      {name:'Night', color:PALETTE[3], values:sorted.map(x=>x.c.nightCost)},
      {name:'Peak', color:PALETTE[2], values:sorted.map(x=>x.c.peakCost)}
    ]);
  });

  if(s){
    chart(()=>{
      if(s.profile && s.profile.length && $('#cProfile')){
        profileChart($('#cProfile'), s.profile, Y.energy.bands, s.intervalMins||30,
          {day:PALETTE[1], night:PALETTE[3], peak:PALETTE[2]});
      }
      lineChart($('#cUsage'), s.byMonth.map(m=>m.month), [
        {name:'Day', color:PALETTE[1], values:s.byMonth.map(m=>m.day)},
        {name:'Night', color:PALETTE[3], values:s.byMonth.map(m=>m.night)},
        {name:'Peak', color:PALETTE[2], values:s.byMonth.map(m=>m.peak)},

      ], {axisFormat: v=>Math.round(v).toString(), tipFormat: v=>v.toFixed(1)+' kWh'});
    });
  }
}

function wireMaternity(el){
  const M = Y.maternity;
  wireFields(el);
  $$('[data-preset]',el).forEach(b=> b.onclick = ()=>{
    const [paid,unpaid] = b.dataset.preset.split(',').map(Number);
    M.paidWeeks = paid; M.unpaidWeeks = unpaid; save(); render();
  });
  if($('#addPhase')) $('#addPhase').onclick = ()=>{
    const used = (M.employerPhases||[]).reduce((s,p)=>s+num(p.weeks),0);
    const left = Math.max(1, num(M.paidWeeks)+num(M.unpaidWeeks) - used);
    M.employerPhases.push({id:uid(), weeks:left, mode:'topup', amount:0});
    save(); render();
  };
  if($('#quickFull')) $('#quickFull').onclick = ()=>{
    M.employerPhases = [{id:uid(), weeks:26, mode:'topup', amount:0}]; save(); render();
  };
  if($('#quickHalf')) $('#quickHalf').onclick = ()=>{
    M.employerPhases = [{id:uid(), weeks:12, mode:'topup', amount:0},
                        {id:uid(), weeks:14, mode:'percent', amount:50}];
    save(); render();
  };
  $$('[data-del-phase]',el).forEach(b=> b.onclick = ()=>{
    M.employerPhases.splice(+b.dataset.delPhase,1); save(); render();
  });
}

/* ---------------- export helpers ---------------- */
const slug = s => String(s||'sheet').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sheet';
/* A cell starting = + - @ (or a leading tab/CR) is executed as a formula by Excel,
   Sheets and LibreOffice. A bill named =HYPERLINK(...) would fire on open, so any
   text cell that starts with one is prefixed with an apostrophe on the way out. */
function csvSafe(v){
  const s = (v===null||v===undefined)?'':String(v);
  if(typeof v === 'number') return s;
  return /^[=+\-@\t\r]/.test(s) && !/^-?\d*\.?\d+$/.test(s) ? "'"+s : s;
}
function toCSV(rows){
  return rows.map(r=> r.map(c=>{
    const s = csvSafe(c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
}
function downloadBlob(name, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
}
function downloadCSV(name, rows){ downloadBlob(name, new Blob(['\uFEFF'+toCSV(rows)],{type:'text/csv;charset=utf-8'})); }
function downloadText(name, text, type){ downloadBlob(name, new Blob([text],{type:type||'application/json'})); }

/* sheet builders - shared by CSV and XLSX export */
function billsCSV(kind){
  const list = billsOfKind(kind);
  const rows=[['Item','Type','Frequency','Holder','Amount','Annual','Monthly','Weekly','Next due']];
  list.forEach(b=>{ const a=annualOf(b);
    rows.push([b.name, kindOf(b)==='savings'?'Savings':'Bill', b.freq, b.holder, num(b.amount),
      round2(a), round2(a/12), round2(a/52), b.nextDue||'']); });
  const t=billTotals(kind);
  rows.push(['Total','','','',round2(list.reduce((s,b)=>s+num(b.amount),0)),
    round2(t.annual),round2(t.monthly),round2(t.weekly),'']);
  return rows;
}
function savingsSplitCSV(){
  const sp = savingsSplit(), bands = Y.taxBands;
  const rows=[['Person','Own /month','Share of joint /month','Total /month','Annual','% of net pay']];
  sp.rows.forEach((r,i)=>{
    const net = Y.people[i] ? calcTax(Y.people[i],bands).netMonthly : 0;
    rows.push([r.name, round2(r.own), round2(r.joint), round2(r.total), round2(r.total*12),
      net?round2(r.total/net*100):'']);
  });
  rows.push(['Joint pot','', round2(sp.jointMonthly), round2(sp.jointEach)+' each','','']);
  return rows;
}
function taxCSV(){
  const b=Y.taxBands;
  const rows=[['Person','Gross','BIK','Pension','AVC','Taxable','Tax 20%','Tax 40%','Credits','PAYE','PRSI','USC','Deductions','Net annual','Net monthly','Effective %']];
  Y.people.forEach(p=>{ const t=calcTax(p,b);
    rows.push([p.name,round2(t.gross),round2(t.bik),round2(t.pension),round2(t.avc),round2(t.taxable),
      round2(t.tax20),round2(t.tax40),round2(t.credits),round2(t.paye),round2(t.prsi),round2(t.usc),
      round2(t.deductions),round2(t.net),round2(t.netMonthly),round2(t.effective)]); });
  return rows;
}
function analysisCSV(){
  const rows=[['Category','Spend','Weekly average','Monthly average','Monthly budget','Over/under monthly','Annual budget','Over/under period','Budget used %','Transactions']];
  budgetVsActual().forEach(r=> rows.push([r.category,round2(r.spend),round2(r.weeklyActual),round2(r.monthlyActual),
    round2(r.monthlyBudget),round2(r.varMonthly),round2(r.budgetAnnual),round2(r.varPeriod),round2(r.usePct),r.count]));
  return rows;
}
function txnCSV(){
  const rows=[['Date','Description','Detail','Debit','Credit','Balance','Type','Category']];
  Y.txns.forEach(t=> rows.push([t.date,t.desc,t.desc2||'',num(t.debit),num(t.credit),t.balance===''?'':num(t.balance),t.type||'',t.category||'']));

}
function rulesCSV(){
  const rows=[['Description contains','Category']];
  Y.rules.forEach(r=> rows.push([r.match,r.category]));
  return rows;
}
function savingsCSV(){
  const proj = projectSavings();
  const rows=[['Month', ...Y.savings.accounts.map(a=>a.name), 'Total']];
  proj.forEach(r=> rows.push([r.date, ...r.values.map(v=>round2(v)), round2(r.total)]));
  const dips = [];
  Y.savings.accounts.forEach(a=> Object.entries(a.adjust||{}).forEach(([mk,v])=> dips.push([mk, a.name, num(v)])));
  if(dips.length){
    rows.push([]); rows.push(['Money taken out']); rows.push(['Month','Account','Amount']);
    dips.sort((x,y)=> x[0]<y[0]?-1:1).forEach(d=> rows.push(d));
  }
  return rows;
}
function historyCSV(){
  const rows=[['Month','Category','Amount']];

  return rows;

function profileCSV(){
  const s = Y.energy.summary;
  const rows=[['Time','Average kWh','Band']];
  if(!s || !s.profile) return rows;
  const mins = s.intervalMins||30;
  s.profile.forEach((v,i)=>{
    const t = new Date(2026,0,1, Math.floor(i*mins/60), (i*mins)%60);
    rows.push([String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'),
      v, bandFor(t, Y.energy.bands)]);
  });
  return rows;
}
function usageCSV(){
  const s = Y.energy.summary;
  const rows=[['Month','Day kWh','Night kWh','Peak kWh','Total kWh']];
  if(!s) return rows;
  s.byMonth.forEach(m=> rows.push([m.month,m.day,m.night,m.peak,m.total]));
  rows.push(['Total',s.day,s.night,s.peak,s.total]);
  rows.push([]);
  rows.push(['Period',s.from+' to '+s.to,'MPRN',(Y.energy.mprn||s.mprn||''),'Readings',s.intervals]);
  return rows;
}
function offersCSV(){
  const s = Y.energy.summary;
  const rows=[['Plan','Day c/kWh','Night c/kWh','Peak c/kWh','Standing /yr','Discount %','Inc VAT',
               'Day cost','Night cost','Peak cost','Per year','Per month','Effective c/kWh','Current']];

/* ---------------- minimal xlsx writer (store-only zip, inline strings) ---------------- */
const CRC_TABLE = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(buf){ let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
const enc = s => new TextEncoder().encode(s);
function zipStore(files){
  const chunks=[], central=[]; let offset=0;
  const dv = n => { const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,n,true); return b; };
  const sv = n => { const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n,true); return b; };
  for(const f of files){
    const name = enc(f.name), data = f.data;
    const crc = crc32(data);
    const local = [enc('PK\x03\x04'), sv(20), sv(0), sv(0), sv(0), sv(0), dv(crc), dv(data.length), dv(data.length), sv(name.length), sv(0), name, data];
    local.forEach(x=>chunks.push(x));
    central.push([enc('PK\x01\x02'), sv(20), sv(20), sv(0), sv(0), sv(0), sv(0), dv(crc), dv(data.length), dv(data.length),
      sv(name.length), sv(0), sv(0), sv(0), sv(0), dv(0), dv(offset), name]);
    offset += 30 + name.length + data.length;
  }
  const cdStart = offset; let cdSize = 0;
  central.forEach(parts=>{ parts.forEach(p=>{ chunks.push(p); cdSize += p.length; }); });
  chunks.push(enc('PK\x05\x06'), sv(0), sv(0), sv(files.length), sv(files.length), dv(cdSize), dv(cdStart), sv(0));
  let total=0; chunks.forEach(c=>total+=c.length);
  const out = new Uint8Array(total); let pos=0;
  chunks.forEach(c=>{ out.set(c,pos); pos+=c.length; });
  return out;
}
const xmlEsc = s => String(s)
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')   // illegal in XML 1.0 - would corrupt the workbook
  .replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m]));
function colName(i){ let s=''; i++; while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); } return s; }
function sheetXml(rows){
  const body = rows.map((r,ri)=>{
    const cells = r.map((v,ci)=>{
      const ref = colName(ci)+(ri+1);
      if(v===null||v===undefined||v==='') return '';
      if(typeof v==='number' && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(csvSafe(v))}</t></is></c>`;
    }).join('');
    return `<row r="${ri+1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}
function buildXlsx(sheets){
  const names = [], used = new Set();
  sheets.forEach(s=>{
    let n = String(s.name).replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31) || 'Sheet';
    let base=n, k=2; while(used.has(n)){ n = (base.slice(0,28)+' '+k++); }
    used.add(n); names.push(n);
  });
  const files = [];
  files.push({name:'[Content_Types].xml', data:enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`)});
  files.push({name:'_rels/.rels', data:enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)});
  files.push({name:'xl/workbook.xml', data:enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${names.map((n,i)=>`<sheet name="${xmlEsc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`)});
  files.push({name:'xl/_rels/workbook.xml.rels', data:enc(
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${names.map((n,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
</Relationships>`)});
  sheets.forEach((s,i)=> files.push({name:`xl/worksheets/sheet${i+1}.xml`, data:enc(sheetXml(s.rows))}));
  return zipStore(files);
}
function downloadXlsx(name, sheets){
  downloadBlob(name, new Blob([buildXlsx(sheets)],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}

        <tfoot><tr><td>Total</td><td class="n">${fmt(F.L)}</td><td></td></tr></tfoot></table></div>
      <div class="chips" style="margin-top:10px">${liabIdeas.map(n=>`<button class="chip" data-nw-add="liabs|${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>

      `<button class="btn primary" id="snapNow">📸 Save a snapshot today</button>`)}

      ${legendHtml([{label:'Net worth',color:PALETTE[0]},{label:'Owned',color:PALETTE[5]},{label:'Owed',color:PALETTE[2]}])}`

    {name:'Owed', color:PALETTE[2], values:snaps.map(s=>s.liabs), dash:true}
  ]));
}

function goalsHtml(){
  const E = Y.emergency, H = household();
  const target = E.months * H.bills;
  const saved = num(E.saved) || savingsTotal();
  const prog = target>0 ? clamp(saved/target*100,0,100) : 0;
  const cover = H.bills>0 ? saved/H.bills : 0;
  const goals = Y.goals.map((g,i)=>{ const f = goalFigures(g); return `<div class="card" style="margin-bottom:12px;box-shadow:none;background:var(--surface2);border-color:transparent">
    <div class="row" style="align-items:flex-end">
      <label class="f" style="flex:2;min-width:160px;margin:0"><span>Goal</span><input data-path="goals.${i}.name" value="${esc(g.name)}"></label>
      <label class="f" style="flex:1;min-width:110px;margin:0"><span>Target amount</span><input class="num" data-path="goals.${i}.target" data-type="number" value="${num(g.target)||''}" data-need></label>
      <label class="f" style="flex:1;min-width:110px;margin:0"><span>Saved so far</span><input class="num" data-path="goals.${i}.saved" data-type="number" value="${num(g.saved)||''}"></label>
      <label class="f" style="flex:1;min-width:140px;margin:0"><span>Needed by</span><input type="date" data-path="goals.${i}.due" value="${esc(g.due||'')}"></label>
      <button class="btn sm danger" data-del-goal="${i}" aria-label="Delete goal">x</button>
    </div>
    <div class="meter ${f.prog>=100?'good':''}" style="margin:14px 0 6px"><i style="width:${f.prog}%"></i></div>
    <div class="row" style="align-items:center">
      <span class="note" style="margin:0">${f.target>0?`<b>${fmt0(f.saved)}</b> of ${fmt0(f.target)} (${f.prog.toFixed(0)}%)`:'Enter a target amount.'}
        ${f.prog>=100?' - 🎉 goal reached!':f.monthly>0?` - save <b>${fmt0(Math.ceil(f.monthly))} a month</b> for ${f.months} month${f.months===1?'':'s'}`:f.late?' - the date has passed':f.remaining>0&&!f.due?' - add a date to see the monthly amount':''}</span>
      <span class="spacer"></span>
      ${f.monthly>0?`<button class="btn sm" data-goal-budget="${i}">Add to my budget</button>`:''}
    </div></div>`; }).join('');
  return `<div class="card">
    ${cardHead('Emergency fund','Savings for the unexpected - a car repair, a boiler, a gap between jobs.')}
    <div class="grid g3">
      <label class="f"><span>Months of bills to cover</span>
        <select data-path="emergency.months" data-type="number">${[1,3,6,9,12].map(m=>`<option value="${m}" ${E.months===m?'selected':''}>${m} month${m===1?'':'s'}${m===3?' (minimum)':m===6?' (recommended)':''}</option>`).join('')}</select></label>
      <label class="f"><span>Saved for emergencies so far ${ttHtml('Leave this at 0 and we use the total of your savings accounts instead.')}</span>
        <input class="num" data-path="emergency.saved" data-type="number" value="${num(E.saved)||''}" placeholder="${fmt0(savingsTotal())} (all savings)"></label>
      <div class="kpi" style="align-self:start"><div class="lbl" data-nott>Target</div><div class="val">${fmt0(target)}</div><div class="sub">${E.months} × ${fmt0(H.bills)} of bills</div></div>
    </div>
    ${H.bills>0 ? `<div class="meter ${prog>=100?'good':prog>=50?'':'warn'}" style="margin:2px 0 6px"><i style="width:${prog}%"></i></div>
      <div class="note" style="margin:0">${fmt0(saved)} saved covers <b>${cover.toFixed(1)} months</b> of bills ${prog>=100?' - fully funded 🎉':''}</div>`
      : '<div class="note">Add your bills on the Bills page and the target is worked out for you.</div>'}
  </div>
  <div class="card">
    ${cardHead('Savings goals','A holiday, a new car, a wedding, a deposit. Set a target and a date and we work out the monthly amount.',
      '<button class="btn primary" id="addGoal">+ Add a goal</button>')}
    ${goals || emptyState('🎯','No goals yet','Goals turn "I should save" into a number you can act on.',
       `<div class="chips" style="justify-content:center">${['Holiday','New car','Christmas','House deposit','Wedding','Home improvements'].map(n=>`<button class="chip" data-goal-idea="${esc(n)}">+ ${esc(n)}</button>`).join('')}</div>`)}
  </div>`;
}
function renderSavingsPage(el){
  renderSavings(el);
  const box = document.createElement('div');
  box.id = 'goalsBox';
  box.innerHTML = goalsHtml();
  el.insertBefore(box, el.firstChild);
  wireFields(box);
  const add = n=>{ Y.goals.push({id:uid(), name:n||'New goal', target:0, saved:0, due:''}); save(); render(); };
  $('#addGoal', box).onclick = ()=> add();
  $$('[data-goal-idea]', box).forEach(b=> b.onclick = ()=> add(b.dataset.goalIdea));
  $$('[data-del-goal]', box).forEach(b=> b.onclick = ()=>{ Y.goals.splice(+b.dataset.delGoal,1); save(); render(); });
  $$('[data-goal-budget]', box).forEach(b=> b.onclick = ()=>{
    const g = Y.goals[+b.dataset.goalBudget], f = goalFigures(g);
    const name = 'Goal: '+g.name;
    let bill = Y.bills.find(x=>x.name===name && kindOf(x)==='savings');
    if(!bill){ bill = {id:uid(), name, freq:'Monthly', holder:'Joint', amount:0, nextDue:'', kind:'savings'}; Y.bills.push(bill); }
    bill.amount = Math.ceil(f.monthly);
    save(); render(); toast('Added to your budget as '+fmt0(bill.amount)+' a month');
  });
}

function originalLedgerData(){
  try{
    const raw = localStorage.getItem('ledger.v1');
    if(!raw) return null;
    const j = JSON.parse(raw);
    return (j && j.years && Object.keys(j.years).length) ? j : null;
  }catch(e){ return null; }
}
function adoptDB(j, keepPrefs){
  if(keepPrefs){
    j.ui = Object.assign({}, DB.ui, j.ui||{});
    j.netWorth = j.netWorth || DB.netWorth;
    j.tracker = j.tracker || DB.tracker;
    j.theme = j.theme || DB.theme;
    j.lastBackup = j.lastBackup || DB.lastBackup;
  }
  DB = j;
  if(!DB.years[DB.active]) DB.active = Object.keys(DB.years).sort()[0];
  ensureDB();
  Object.values(DB.years).forEach(migrate);
  Y = DB.years[DB.active]; CUR = safeCur(Y.currency);
  applyTheme();
}

/* ---------------- year management ---------------- */
/* A full copy of the current year under a new label - for "what if things change in
   March" scenarios, or just a safe sandbox to try figures in. Everything comes across,
   transactions included, because the point is to compare like with like. */
function duplicateYear(){
  const suggested = yearKey(yearLabel()+'-2');
  const input = prompt('Name for the copy (everything in '+yearLabel()+' is copied across):', suggested);
  if(input===null) return;
  const label = String(input).trim();
  if(!label){ toast('Needs a name'); return; }
  const key = yearKey(label);
  const copy = JSON.parse(JSON.stringify(Y));
  copy.label = label;
  DB.years[key] = copy;
  DB.active = key;
  Y = copy; CUR = safeCur(Y.currency);
  save(); render();
  toast('Copied to '+label);
}
function newYear(){
  const years = Object.keys(DB.years).map(Number);
  const suggested = Math.max(...years)+1;
  const input = prompt('New year to create (bills, loans, mortgage, savings and rules carry over):', suggested);
  if(!input) return;
  const y = parseInt(input,10);
  if(!y || y<1990 || y>2200){ toast('Enter a year like '+suggested); return; }
  if(DB.years[y] && !confirm(y+' already exists. Overwrite it?')) return;
  const src = Y;
  const seed = {
    people: JSON.parse(JSON.stringify(src.people)),
    bills: JSON.parse(JSON.stringify(src.bills)),
    loans: JSON.parse(JSON.stringify(src.loans)),
    mortgages: JSON.parse(JSON.stringify(src.mortgages||[])),
    savings: JSON.parse(JSON.stringify(src.savings)),
    rules: JSON.parse(JSON.stringify(src.rules)),
    history: JSON.parse(JSON.stringify(src.history)),
    accounts: JSON.parse(JSON.stringify(src.accounts||[])),
    payees: JSON.parse(JSON.stringify(src.payees||[])),
    energy: JSON.parse(JSON.stringify(src.energy||blankEnergy())),
    maternity: JSON.parse(JSON.stringify(src.maternity||blankMaternity()))
  };
  if(seed.energy) seed.energy.summary = null;   // new year, re-import the usage file
  const nd = blankYear(y, seed);
  const p = presetFor(y);
  nd.goals = JSON.parse(JSON.stringify(src.goals||[]));
  nd.emergency = JSON.parse(JSON.stringify(src.emergency||{months:3, saved:0}));
  nd.renewals = JSON.parse(JSON.stringify(src.renewals||{items:[]}));   // contract end dates are real dates, so they carry over
  migrate(nd);                                                         // fills every field a page reads, as a restore would
  nd.people.forEach(pp=>{
    const st = BAND_STATUS[pp.status];
    if(st && st.pick) pp.srcop = st.pick(p); else if(!pp.srcop) pp.srcop = p.srcopSingle;
    refreshCredits(pp, y);
  });
  nd.savings.startDate = y+'-01-01';
  nd.splitMode = src.splitMode; nd.splitManual = JSON.parse(JSON.stringify(src.splitManual||{}));
  nd.lodgeIncludesSavings = src.lodgeIncludesSavings!==false;
  nd.currency = src.currency;
  DB.years[String(y)] = nd;
  DB.active = String(y);
  Y = nd; save(); render();
  toast(y+' created - transactions start empty');
}

  const pctW = st.budget ? Math.min(100, st.actual / st.budget * 100) : (st.actual ? 100 : 0);
  const note = isOver ? 'over by '+trackerMoneyK(st.actual - st.budget, cur) : st.budget ? Math.round(st.actual / st.budget * 100)+'% used' : 'no budget';
  return `<div class="card" data-s="${esc(s.id)}">
    <div class="trk-stagehead">
      <button class="btn sm ghost" style="font-size:16px;padding:2px 8px" data-act="toggle" aria-expanded="${s.open}" aria-label="${s.open?'Collapse':'Expand'} stage">${s.open?'▾':'▸'}</button>

      <div class="tot"><b class="num">${esc(trackerMoneyK(st.actual, cur))}</b> <span class="mut">/ ${esc(trackerMoneyK(st.budget, cur))}</span><br><span class="pill ${isOver?'bad':''}">${esc(note)}</span></div>
      <button class="btn sm danger" data-act="delSection" aria-label="Delete stage">x</button>
    </div>
    <div class="meter ${isOver?'bad':''}" style="margin:10px 0 4px"><i style="width:${pctW}%"></i></div>
    ${!s.open ? '' : `
    <div class="trk-head"><span title="Paid">✓</span><span>Item ${ttHtml('Tick the box when an item is paid. A ticked item counts at what you actually paid; an unticked one counts at its budget, or what you have spent if that is more.')}</span><span class="n">Budget</span><span class="n">Spent</span><span></span></div>

  </div>`;
}

function trackerCharts(p){
  const t = trackerTotals(p);
  if(!t.stages.length) return;
  chart(()=>{
    const keep = CUR; CUR = safeCur(p.currency);          // the chart code formats with the global currency symbol
    try{
      hBars($('#cTrkBars'), t.stages.map(s=>s.name), [
        {name:'Budget', color:PALETTE[0], values:t.stages.map(s=>s.budget)},
        {name:'Spent',  color:PALETTE[1], values:t.stages.map(s=>s.actual)}]);
      const items = t.stages.map((s,i)=>({label:s.name, value:s.actual, color:PALETTE[i%PALETTE.length]})).filter(x=>x.value>0);
      donut($('#cTrkDonut'), items, {caption:'spent'});
      $('#trkLegend').innerHTML = items.length ? legendHtml(items) : '<div class="note">Fill in what has been spent and this fills up.</div>';
    } finally { CUR = keep; }
  });
}

/* one pair of delegated listeners for the whole page (the page is rebuilt on every edit, so listeners on the
   elements themselves would be lost; these sit on the section, which is not) */
function wireTracker(el){
  if(el.dataset.trkWired) return;
  el.dataset.trkWired = '1';
  const T = () => DB.tracker;
  const stage = id => { const p = trackerProject(); return p && p.sections.find(s=>s.id===id); };
  const item = (sid, iid) => { const s = stage(sid); return s && s.items.find(i=>i.id===iid); };
  const commit = ()=>{ save(); render(); };

  el.addEventListener('click', e=>{
    const btn = e.target.closest('[data-act]');
    if(!btn || /^(INPUT|SELECT)$/.test(btn.tagName)) return;
    const act = btn.dataset.act, p = trackerProject();
    const sec = e.target.closest('[data-s]'), row = e.target.closest('.trk-item'), fund = e.target.closest('.trk-fund');
    if(act==='tpl'){
      let np;
      if(btn.dataset.tpl==='blank'){
        const name = prompt('Name this project', 'My project'); if(name===null) return;
        np = trackerNewProject(name.trim() || 'My project');
      } else np = trackerFromTemplate(btn.dataset.tpl);
      T().projects.push(np); T().active = np.id; trackerPicking = false; commit();
      toast('Project created - now fill in the costs');
    }
    else if(act==='cancelPick'){ trackerPicking = false; render(); }
    else if(act==='newProject'){ trackerPicking = true; render({reset:true}); window.scrollTo({top:0}); }
    else if(act==='standalone'){
      const f = trackerStandalone(); if(!f) return;
      trackerAdd(f.projects); trackerPicking = false; commit(); toast('Brought across '+f.projects.length+' project'+(f.projects.length===1?'':'s'));
    }
    else if(act==='rename' && p){ const name = prompt('Rename project', p.name); if(name===null) return; p.name = name.trim() || p.name; commit(); }
    else if(act==='delProject' && p){
      if(!confirm('Delete "'+p.name+'" and everything in it? This cannot be undone.')) return;
      T().projects = T().projects.filter(x=>x.id!==p.id);
      T().active = T().projects[0] ? T().projects[0].id : '';
      commit(); toast('Project deleted');
    }
    else if(act==='addStage' && p){
      p.sections.push({id:uid(), name:'New stage', open:true, items:[]}); commit();
      const names = $$('input[data-act="sname"]', el); const last = names[names.length-1]; if(last){ last.focus(); last.select(); }
    }
    else if(act==='toggle'){ const s = stage(sec.dataset.s); s.open = !s.open; commit(); }
    else if(act==='delSection'){
      const s = stage(sec.dataset.s);
      if(s.items.length && !confirm('Delete "'+s.name+'" and its '+s.items.length+' item'+(s.items.length===1?'':'s')+'?')) return;
      p.sections = p.sections.filter(x=>x.id!==s.id); commit();
    }
    else if(act==='addItem'){
      stage(btn.dataset.s).items.push(trackerNewItem('New item', 0)); commit();
      const names = $$('[data-s="'+btn.dataset.s+'"] .iname', el); const last = names[names.length-1]; if(last){ last.focus(); last.select(); }
    }
    else if(act==='delItem'){ const s = stage(row.dataset.s); s.items = s.items.filter(i=>i.id!==row.dataset.i); commit(); }
    else if(act==='addFund' && p){ p.funding.push({id:uid(), name:'New source', amount:0}); commit(); }
    else if(act==='delFund' && p){ p.funding = p.funding.filter(f=>f.id!==fund.dataset.f); commit(); }
    else if(act==='fundFrom' && p){ p.funding.push({id:uid(), name:btn.dataset.name, amount:num(btn.dataset.amount)}); commit(); }
    else if(act==='exportJson'){ downloadText('budget-tracker-'+iso(new Date())+'.json', JSON.stringify(T(), null, 2)); toast('Saved your projects'); }
    else if(act==='exportCsv' && p){ downloadCSV(slug(p.name)+'-'+iso(new Date())+'.csv', trackerCsvRows(p)); }
    else if(act==='import'){ $('#trkFile').click(); }
  });

  el.addEventListener('change', e=>{
    const t = e.target; if(!t.dataset || !t.dataset.act) return;
    const act = t.dataset.act, p = trackerProject();
    const row = t.closest('.trk-item'), sec = t.closest('[data-s]'), fund = t.closest('.trk-fund');
    if(act==='proj'){ T().active = t.value; trackerPicking = false; commit(); }
    else if(act==='cur' && p){ p.currency = safeCur(t.value); commit(); }
    else if(act==='iname'){ item(row.dataset.s, row.dataset.i).name = t.value.trim() || 'Untitled'; commit(); }
    else if(act==='budget' || act==='actual'){ item(row.dataset.s, row.dataset.i)[act] = parseAmount(t.value); commit(); }
    else if(act==='done'){ item(row.dataset.s, row.dataset.i).done = t.checked; commit(); }
    else if(act==='sname'){ stage(sec.dataset.s).name = t.value.trim() || 'Untitled stage'; commit(); }
    else if(act==='fname' && p){ p.funding.find(f=>f.id===fund.dataset.f).name = t.value.trim() || 'Source'; commit(); }
    else if(act==='famount' && p){ p.funding.find(f=>f.id===fund.dataset.f).amount = parseAmount(t.value); commit(); }
  });
  /* Enter in a box commits it, like leaving it */
  el.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.tagName==='INPUT' && e.target.dataset.act) e.target.blur(); });

  el.addEventListener('change', e=>{
    if(e.target.id !== 'trkFile') return;
    const f = e.target.files[0]; e.target.value = '';
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      let n = null;
      try{ n = trackerNormalise(JSON.parse(rd.result)); }catch(err){ n = null; }
      if(!n || !n.projects.length){ toast('That file is not a budget tracker export'); return; }
      if(T().projects.length){
        if(confirm('Add '+n.projects.length+' project'+(n.projects.length===1?'':'s')+' to the ones you already have?')) trackerAdd(n.projects);
        else if(confirm('Replace ALL your projects with the ones in this file? This cannot be undone.')) DB.tracker = n;
        else return;
      } else DB.tracker = n;
      trackerPicking = false; commit(); toast('Imported '+n.projects.length+' project'+(n.projects.length===1?'':'s'));
    };
    rd.onerror = ()=> toast('Could not read that file');
    rd.readAsText(f);
  });
}

  setStatus('');
  if(!DB.ui.welcomed && isBlankYear(Y)) showWelcome();
  /* localStorage has already rendered above, so the page is never blank while this is in
     flight, and on anything but a Penny Keeper server it does nothing at all. */
  initSync();
}
init();

</script></body></html>
