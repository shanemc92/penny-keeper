<style>
:root{
  --bg:#f5f7f9; --surface:#ffffff; --surface2:#f0f3f6; --line:#e1e6ec;
  --text:#18212c; --muted:#5d6978; --accent:#0d7a69; --accent-dim:#9fd3c9; --accent-soft:#e5f4f1;
  --good:#2b7a30; --warn:#8c5408; --bad:#bf3a2e;
  --good-soft:#e6f4e7; --warn-soft:#fdf1dc; --bad-soft:#fbe6e3; --info-soft:#e8f0fb; --info:#2c5fa8;
  --need:#e8960c; --need-soft:#fff6e3;
  --on-accent:#ffffff; --on-good:#ffffff;
  color-scheme:light;
  --radius:12px; --side:256px;
}
[data-theme="dark"]{
  --bg:#0f141b; --surface:#171d26; --surface2:#1e2631; --line:#2a3441;
  --text:#e7ecf3; --muted:#9ca7b7; --accent:#43c4ad; --accent-dim:#2a5f56; --accent-soft:#16312e;
  --good:#72c478; --warn:#e2b255; --bad:#ec7a6e;
  --good-soft:#17301b; --warn-soft:#352a12; --bad-soft:#3a1d19; --info-soft:#15263d; --info:#7fb0ee;
  --need:#f0a62a; --need-soft:#34290f;
  --on-accent:#04231e; --on-good:#08210b;     /* the dark-mode accent and green are light, so their text is dark */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.num,input[type=number],td.n,th.n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-weight:650;margin:0;line-height:1.25}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
p{margin:0 0 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 12px;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16.5px;line-height:1.15;padding:2px 8px 14px}
.brand .mark{width:36px;height:36px;flex:none;display:block}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.yearbox{display:flex;gap:6px;align-items:center;margin:0 4px 12px}
.yearbox select{flex:1;font-weight:600}
.navgroup{margin-top:6px}
.navgroup h6{margin:12px 10px 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:9px 10px;border-radius:9px;color:var(--text);font-size:14.5px;cursor:pointer;position:relative;
}
.navbtn .ico{width:22px;text-align:center;font-size:16px;flex:none}
.navbtn .lab{flex:1;min-width:0}
.navbtn .sub{display:block;font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:1px}
.navbtn:hover{background:var(--surface2)}
.navbtn.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.navbtn.active .sub{color:var(--accent);opacity:.85}
.navbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--need);flex:none}
.navbtn .ok{color:var(--good);font-size:13px}
.side .grow{flex:1;min-height:12px}
.sidefoot{border-top:1px solid var(--line);padding:10px 6px 2px;font-size:12px;color:var(--muted)}
.sidefoot b{color:var(--text)}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:10px 20px;flex-wrap:wrap;
}
.top .crumb{font-weight:650;font-size:15px;margin-right:auto;display:flex;align-items:center;gap:8px}
.status{font-size:12px;color:var(--muted)}
.burger{padding:6px 11px;font-size:16px;line-height:1}
#pages{padding:22px 28px 80px;max-width:1760px;width:100%;margin:0 auto}
body.nav-collapsed .app{grid-template-columns:minmax(0,1fr)}
body.nav-collapsed .side{display:none}
section{display:none}
section.active{display:block}

/* ---------- page header ---------- */
.pagehead{margin-bottom:18px}
.pagehead h1{font-size:26px;display:flex;align-items:center;gap:10px}
.pagehead h1 .ico{font-size:24px}
.pagehead .lead{color:var(--muted);font-size:15.5px;margin:6px 0 0;text-wrap:pretty}
.stepstrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stepstrip .st{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px}
.stepstrip .st i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.howto{margin-top:12px}
.howto>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;list-style:none;display:inline-flex;gap:6px;align-items:center}
.howto>summary::-webkit-details-marker{display:none}
.howto[open]>summary{margin-bottom:8px}
.howto .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;max-width:760px}
.howto ul{margin:0;padding-left:20px}
.howto li{margin:5px 0}

/* ---------- callouts ---------- */
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);margin-bottom:14px}
.callout .ci{font-size:20px;line-height:1.2;flex:none}
.callout .cb{flex:1;min-width:0}
.callout .cb .ct{display:block;margin-bottom:2px}
.callout.info{background:var(--info-soft);border-color:transparent}
.callout.tipc{background:var(--accent-soft);border-color:transparent}
.callout.warn{background:var(--warn-soft);border-color:transparent}
.callout.bad{background:var(--bad-soft);border-color:transparent}
.callout.good{background:var(--good-soft);border-color:transparent}
.callout .btn{margin-top:8px}
.callout .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}

/* ---------- controls ---------- */
button,select,input,textarea{font-family:inherit;font-size:14px;color:var(--text)}
.btn{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 14px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:6px;
  transition:border-color .12s,background .12s,transform .05s;
}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.lg{padding:11px 20px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.btn.danger:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
input,select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;
  transition:border-color .12s,box-shadow .12s;
}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--muted) 50%,var(--line))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button:focus-visible,.navbtn:focus-visible,.tt:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
/* the open list of a dropdown: readable text on the theme's own background, and a clear highlight */
select option,select optgroup{background-color:var(--surface);color:var(--text)}
select option:checked,select option:hover{background:var(--accent) linear-gradient(0deg,var(--accent),var(--accent));color:var(--on-accent)}
input[type=file]{padding:6px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
label.f>span .opt{font-weight:500;color:var(--muted);font-size:12px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
/* fields the calculations are waiting on */
.need{border-color:var(--need)!important;background:var(--need-soft)!important}
.needtag{display:inline-block;font-size:11px;font-weight:700;color:#7a4a00;background:var(--need);color:#2b1a00;border-radius:5px;padding:0 6px;margin-left:6px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- tooltips ---------- */
.tt{
  display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;flex:none;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;
  cursor:help;line-height:1;user-select:none;margin-left:2px;text-transform:none;letter-spacing:0;
}
.tt:hover,.tt:focus-visible,.tt.open{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#tipbox{
  position:fixed;z-index:200;max-width:300px;background:#18212c;color:#f1f4f8;border-radius:10px;
  padding:10px 12px;font-size:13px;line-height:1.45;
  opacity:0;pointer-events:none;transition:opacity .12s;text-transform:none;letter-spacing:0;font-weight:450;
}
#tipbox.on{opacity:1}
#tipbox b{color:#8fe0cf}

/* ---------- layout blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card>h2,.card-h h2{font-size:17px;margin-bottom:12px;color:var(--text);text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{margin:0}
.card-h .sub{color:var(--muted);font-size:13.5px;margin-top:3px;flex-basis:100%}
.card-h .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card.accent{border-color:var(--accent);border-width:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid>*{min-width:0}
.spacer{flex:1}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card .kpi{background:var(--surface2);border-color:transparent}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.01em}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)} .amb{color:var(--warn)} .mut{color:var(--muted)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{
  text-align:left;font-size:12.5px;color:var(--muted);font-weight:650;padding:8px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
th .tt{margin-left:4px}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th.n,td.n{text-align:right}
tbody tr:hover{background:color-mix(in srgb,var(--surface2) 70%,transparent)}
tfoot td{font-weight:650;border-top:2px solid var(--line);border-bottom:0}
table input,table select{padding:6px 8px;min-width:76px}
td.act{width:1%;white-space:nowrap;text-align:right}
.empty{color:var(--muted);text-align:center;padding:26px 14px;font-size:14px}
.emptystate{text-align:center;padding:28px 16px}
.emptystate .big{font-size:38px;margin-bottom:6px}
.emptystate h3{font-size:17px;margin-bottom:4px}
.emptystate p{color:var(--muted);max-width:520px;margin:0 auto 14px}
td.tap{cursor:text;min-width:110px}
td.tap:hover{background:var(--surface2);border-radius:4px}

/* ---------- small bits ---------- */
.sect{font-size:15px;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-weight:600}
.pill.on{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-soft)}
.pill.good{border-color:transparent;background:var(--good-soft);color:var(--good)}
.pill.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.pill.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:550;
}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip small{color:var(--muted);font-weight:500}
.chip.on small{color:var(--on-accent);opacity:.8}
.bar{position:relative;height:18px;background:var(--surface2);border-radius:9px;min-width:110px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-dim);border-radius:9px}
.bar i.over{background:var(--bad)}
.bar b{position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--text);opacity:.5}
.bar em{position:absolute;right:6px;top:0;font-style:normal;font-size:11px;line-height:18px;color:var(--text);font-family:ui-monospace,Menlo,monospace}
.meter{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)} .meter.good i{background:var(--good)}
.stack{display:flex;height:22px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.legend b{color:var(--text);margin-left:5px;font-weight:650}
canvas{display:block;max-width:100%}
.chartbox{height:260px;position:relative;overflow:hidden}
.chartbox.auto{height:auto}
.tip{
  position:absolute;pointer-events:none;z-index:5;opacity:0;transition:opacity .1s;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;
  font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;
  color:var(--text);
}
.tip.on{opacity:1}
.tip b{display:block;font-weight:600;margin-bottom:2px;color:var(--muted);font-size:11px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#18212c;color:#fff;
  border-radius:10px;padding:10px 18px;z-index:300;
  opacity:0;pointer-events:none;transition:opacity .18s;font-size:14px
}
.toast.show{opacity:1}
details>summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:6px 0;font-weight:550}
details>summary:hover{color:var(--text)}
.more{border:1px dashed var(--line);border-radius:10px;padding:2px 14px;margin-top:12px}
.more[open]{padding-bottom:12px}
details.plain{margin:6px 0 16px}
details.plain>summary{font-size:17px;font-weight:650;color:var(--text);padding:6px 0;margin-bottom:6px}


/* ---------- home / dashboard ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;align-items:center}
.hero .big{font-size:40px;font-weight:750;letter-spacing:-.02em;font-family:ui-monospace,Menlo,Consolas,monospace}
.hero .big small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;font-family:inherit}
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.hc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;border-left:4px solid var(--line)}
.hc.good{border-left-color:var(--good)} .hc.warn{border-left-color:var(--need)} .hc.bad{border-left-color:var(--bad)}
.hc .t{font-size:13px;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:4px}
.hc .v{font-size:22px;font-weight:700;margin:3px 0 6px;font-family:ui-monospace,Menlo,Consolas,monospace}
.hc .d{font-size:13px;color:var(--muted)}
.upnext li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.upnext li:last-child{border:0}
.upnext .when{width:64px;flex:none;text-align:center;border-radius:8px;background:var(--surface2);padding:4px 0;font-size:12px;line-height:1.2}
.upnext .when b{display:block;font-size:17px}
.upnext ul{list-style:none;margin:0;padding:0}
.actions-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.action{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;font-weight:600}
.action:hover{border-color:var(--accent);background:var(--accent-soft)}
.action .ai{font-size:22px}
.action small{display:block;color:var(--muted);font-weight:450;font-size:12.5px}

/* ---------- set-up guide ---------- */
.progress{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);position:relative;font-weight:750}
.ring::before{content:"";position:absolute;inset:7px;background:var(--surface);border-radius:50%}
.ring span{position:relative}
.step{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:14px;overflow:hidden}
.step>header{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer}
.step .snum{width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;flex:none;font-family:inherit}
.step.done .snum{background:var(--good);color:var(--on-good)}
.step.cur{border-color:var(--accent)}
.step.cur .snum{background:var(--accent);color:var(--on-accent)}
.step>header h3{font-size:16px;flex:1}
.step>header small{display:block;color:var(--muted);font-weight:450;font-size:13px}
.step .body{padding:2px 18px 18px;border-top:1px solid var(--line)}
.step:not(.open) .body{display:none}

/* ---------- budget tracker ---------- */
.trk-head,.trk-item{display:grid;grid-template-columns:28px minmax(0,1fr) 120px 120px 38px;gap:8px;align-items:center}
.trk-head{font-size:12.5px;font-weight:650;color:var(--muted);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.trk-head .n{text-align:right}
.trk-item{padding:6px 0;border-bottom:1px solid var(--line)}
.trk-item .amts{display:contents}
.trk-item .a{display:block;margin:0}
.trk-item input.num{text-align:right}
.trk-item input.over{color:var(--bad);font-weight:650}
.trk-item input[type=checkbox]{width:20px;height:20px;margin:0 4px}
.trk-item.done .iname{color:var(--muted);text-decoration:line-through}
.trk-fund{display:grid;grid-template-columns:minmax(0,1fr) 150px 38px;gap:8px;align-items:center;margin:6px 0}
.trk-stagehead{display:flex;align-items:center;gap:8px}
.trk-stagehead .tot{text-align:right;white-space:nowrap}
@media (max-width:700px){
  .trk-head{display:none}
  .trk-item{grid-template-columns:28px minmax(0,1fr) 38px;padding:10px 0}
  .trk-item > input[type=checkbox]{grid-column:1;grid-row:1}
  .trk-item > .iname{grid-column:2;grid-row:1}
  .trk-item > button{grid-column:3;grid-row:1}
  .trk-item .amts{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:2 / 4;grid-row:2}
  .trk-stagehead{flex-wrap:wrap}
  .trk-stagehead .tot{order:5;flex-basis:100%;text-align:left}
  .trk-item .a::before{content:attr(data-label);display:block;font-size:11.5px;font-weight:650;color:var(--muted);margin-bottom:2px}
  .trk-fund{grid-template-columns:minmax(0,1fr) 110px 38px}
}

/* ---------- drawer / modal / tour ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.5);z-index:90;display:none}
.scrim.on{display:block}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);z-index:100;
  transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility 0s .2s;display:flex;flex-direction:column
}
.drawer.on{transform:none;visibility:visible;border-left:1px solid var(--line);transition:transform .2s}
.drawer>header{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);gap:10px}
.drawer>header h2{flex:1;font-size:18px}
.drawer .dbody{padding:16px 18px;overflow-y:auto;flex:1}
.gl{border-bottom:1px solid var(--line);padding:10px 0}
.gl b{display:block}
.gl span{color:var(--muted);font-size:13.5px}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 28px));max-height:90vh;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;z-index:110;padding:26px;display:none
}
.modal.on{display:block}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .opts{display:grid;gap:10px;margin-top:16px}
.modal .opt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:13px 15px;cursor:pointer;width:100%}
.modal .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.modal .opt .oi{font-size:24px}
.modal .opt small{display:block;color:var(--muted);font-weight:450}
#spot{position:fixed;z-index:120;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,15,22,.62);pointer-events:none;transition:all .2s;display:none}
#tourcard{position:fixed;z-index:130;width:min(330px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:none}
#tourcard h3{font-size:16px;margin-bottom:4px}
#tourcard .tf{display:flex;gap:8px;margin-top:12px;align-items:center}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .app,body.nav-collapsed .app{grid-template-columns:minmax(0,1fr)}
  body.nav-collapsed .side{display:flex}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:105;width:min(300px,86vw);transform:translateX(-102%);visibility:hidden;transition:transform .2s,visibility 0s .2s}
  .side.on{transform:none;visibility:visible;transition:transform .2s}
  #pages{padding:16px 14px 80px}
  .hero{grid-template-columns:1fr}
  .top{padding:8px 12px}
  .pagehead h1{font-size:22px}
}
@media (max-width:520px){
  .top .hide-s{display:none}
  .hero .big{font-size:32px}
}

/* bill tables turn into one card per row on a phone */
@media (max-width:700px){
  table.stack-m thead,table.stack-m tfoot{display:none}
  table.stack-m,table.stack-m tbody{display:block}
  table.stack-m tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
  table.stack-m tbody tr:hover{background:none}
  table.stack-m tbody td{display:block;border:0;padding:0;white-space:normal;min-width:0}
  table.stack-m tbody td::before{content:attr(data-label);display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:3px}
  table.stack-m tbody td.first{grid-column:1/-1}
  table.stack-m tbody td.first::before,table.stack-m tbody td.act::before{display:none}
  table.stack-m tbody td.act{grid-column:1/-1;text-align:right;width:auto}
  table.stack-m tbody td.n{text-align:left}
  table.stack-m input,table.stack-m select{width:100%!important;min-width:0!important}
  .kpi .val{font-size:20px}
  .top .status{display:none}
  .top .crumb{display:none}
  .top .status{display:none}
}
@media print{
  .side,.top,.pagehead .howto,#tipbox,.btn,.toast,.drawer,.scrim,.modal,#spot,#tourcard{display:none!important}
  .app{display:block}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
#modal h2 .mark{width:34px;height:34px;vertical-align:-9px;margin-right:10px}
</style>

<script>
/* ---------------------------------------------------------------
   Penny Keeper - Irish household finance in a single HTML file
   All data stays in this browser (localStorage). No network calls.
----------------------------------------------------------------*/
"use strict";

const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = ()=> Math.random().toString(36).slice(2,9);
const clamp = (n,a,b)=> Math.min(b,Math.max(a,n));
const num = v => { const n = parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; };
const round2 = n => Math.round((n+Number.EPSILON)*100)/100;
/* "left empty" has to stay distinguishable from "entered as zero" on the mortgage
   statement fields, where blank means "work it out" and 0 means "the lender charged 0". */
const blankish = v => v===''||v===null||v===undefined;

const FREQ = {Weekly:52, Fortnightly:26, Monthly:12, Quarterly:4, Annual:1};

let CUR = '€';
const fmt = (n,d)=>{
  if(!isFinite(n)) n=0;
  const s = Math.abs(n).toLocaleString('en-IE',{minimumFractionDigits:d??2,maximumFractionDigits:d??2});
  return (n<0 && Number(s.replace(/[^0-9.]/g,''))!==0 ? '-' : '')+CUR+s;
};
const fmt0 = n => fmt(n,0);
const pct = n => (isFinite(n)?n:0).toLocaleString('en-IE',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
/* Mortgage rates are quoted to two places and the second one matters: 3.65% rounded
   to 3.7% is a different product, and a different repayment. */
const ratePct = n => (isFinite(n)?n:0).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
/* Dates are handled entirely in local time: a bare "2026-03-01" parses to local
   midnight and iso() reads the local components back. Mixing the two - parsing as UTC
   the way `new Date('2026-03-01')` does, then formatting with toISOString() - shifted
   every date addMonths() pushed across the GMT/IST boundary back by a day, so a loan
   starting on the 15th produced payments on the 15th in winter and the 14th in summer,
   and the day count either side of the change was wrong with it. */
const iso = d => {
  const x = (d instanceof Date)?d:new Date(d);
  if(isNaN(x)) return '';
  const p = n => String(n).padStart(2,'0');
  return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());
};
const parseDate = s => {
  if(s instanceof Date) return isNaN(s)?null:s;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s??'').trim());
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);      // local midnight, not UTC midnight
  const d = new Date(s);
  return isNaN(d)?null:d;
};
const addMonths = (d,n)=>{ const x=new Date(d.getTime()); const day=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+n);
  x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate())); return x; };
const addDays = (d,n)=>{ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; };
const daysBetween = (a,b)=> Math.round((b-a)/86400000);
const monthKey = d => iso(d).slice(0,7);

/* ---------- Irish tax year presets ----------
   Figures for 2022-2026 are from Revenue's "Tax rates, bands and reliefs" chart and its USC page.
   2027 is from the published Budget 2027 summaries (aftertax.ie, income.ie) - credits that the
   summaries do not state are carried forward from 2026 and marked as estimates. Always confirm
   against revenue.ie and your own Tax Credit Certificate.

   srcopSingle  standard rate band, single person
   srcopMax     standard rate band, married / civil partners with one income
   srcopParent  standard rate band, single parent (Single Person Child Carer Credit)
   srcopSecond  the most a second earner's own band can be (two-income couples)
   uscBands     [{to: cumulative income limit, rate}], the last band has no limit
   prsiExemptWeekly  employees earning this or less a week pay no PRSI */
const TAX_PRESETS = {
  2022:{ srcopSingle:36800, srcopMax:45800, srcopParent:40800, srcopSecond:27800, lowRate:.20, highRate:.40,
    prsiRate1:.04, prsiRate2:.04, prsiChangeMonth:10, prsiExemptWeekly:352,
    uscExempt:13000, uscBands:[{to:12012,rate:.005},{to:21295,rate:.02},{to:70044,rate:.045},{to:1e12,rate:.08}] },
  2023:{ srcopSingle:40000, srcopMax:49000, srcopParent:44000, srcopSecond:31000, lowRate:.20, highRate:.40,
    prsiRate1:.04, prsiRate2:.04, prsiChangeMonth:10, prsiExemptWeekly:352,

/* Income that the standard rate band is measured against: pay plus benefit-in-kind, less pension and AVC. */
function taxableOf(p){
  const gross = num(p.gross);
  return gross + num(p.bikMonthly)*12 - gross*(num(p.pensionPct)/100) - num(p.avcMonthly)*12;
}
/* The standard rate band that really applies to a person.
   Two people marked "married, both working" share the couple's allowance the way Revenue's limit works:
   each has their own band, and whatever one of them cannot use (their income is below it) passes to the
   other, up to the extra that a one-income couple would get (53,000 against 44,000 in 2026). Total tax for the
   household then matches Revenue's combined limit (88,000 in 2026), whoever earns what. */
function effectiveSrcop(p, b){
  const own = num(p.srcop) || num(b.srcopSingle);
  if(p.status !== 'married2') return own;
  const all = (typeof Y!=='undefined' && Y && Array.isArray(Y.people)) ? Y.people : [];
  const mates = all.filter(q=> q.id!==p.id && q.status==='married2');
  if(mates.length !== 1) return num(b.srcopSingle);
  const single = num(b.srcopSingle), extraMax = Math.max(num(b.srcopMax) - single, 0);
  const unused = Math.max(single - Math.max(taxableOf(mates[0]),0), 0);
  return single + Math.min(extraMax, unused);
}

    row('Housing','rentCouple','Rent Tax Credit (jointly assessed couple)','The same credit for a jointly assessed couple - claim it once for the two of you. Refunded after the year ends.'),
    row('Housing','mortInt','Mortgage Interest Tax Credit','For some owner-occupiers (mortgage balance of 80,000 to 500,000 at the end of 2022) whose interest rose. Available for 2023 to 2026 only, with a lower maximum for 2026 - check the amount and whether you qualify on revenue.ie. Refunded after the year ends.'),

/* does a credit row on a person belong to this entry in the library? */
function creditMatches(lib, rowName){
  const n = String(rowName||'').trim().toLowerCase();
  return n === lib.name.toLowerCase() || (lib.legacy||[]).includes(n);
}
const CREDIT_GROUPS = ['Work','Family','Housing','Age and health'];

/* Bring a person's credits up to the figures for a year: the personal credit follows their situation,
   and every other credit that is in the library takes that year's amount. Anything typed in by hand that
   is not in the library is left alone. */
function refreshCredits(p, year){
  const lib = creditLibrary(year);
  const type = p.personalType || defaultPersonalType(p.status);
  (p.credits||[]).forEach(c=>{
    if(/^personal/i.test(c.name)) c.amount = personalAmount(type, year);
    else if(/^employee|paye/i.test(c.name) && !lib.some(l=>creditMatches(l,c.name))) c.amount = creditAmount('employee', year);
    else { const l = lib.find(x=>creditMatches(x, c.name)); if(l) c.amount = l.amount; }
  });
}

/* Contract renewals. Nothing runs in the background - the app is only ever a page in
   a browser - so renewals surface on the dashboard whenever it is open, and that is
   deliberately all they do. */
function blankRenewals(){
  return { items:[] };
}
const daysUntil = d => {
  const t = parseDate(d); if(!t) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  t.setHours(0,0,0,0);
  return Math.round((t - today)/86400000);
};
/* Everything renewing within the window, soonest first - used by the dashboard. */
function upcomingRenewals(withinDays){
  const w = withinDays===undefined ? 60 : withinDays;
  return (Y.renewals && Y.renewals.items || [])
    .map(c => ({...c, days: daysUntil(c.end)}))
    .filter(c => c.days !== null && c.days <= w)
    .sort((a,b)=> a.days - b.days);
}

const KEY = 'penny-keeper.v1';   // not 'ledger.v1', which an older workbook used, so the two never overwrite each other
const EARLIER_KEYS = ['household-finance.v1', 'ledger.easy.v1'];   // names it was saved under before - read once, then saved under KEY

function storedDB(){
  for(const k of [KEY].concat(EARLIER_KEYS)){ const v = localStorage.getItem(k); if(v) return v; }
  return null;
}
let DB = null, Y = null;

function load(){
  try{ DB = JSON.parse(storedDB()); }catch(e){ DB = null; }
  if(!DB || !DB.years || !Object.keys(DB.years).length){
    const y = new Date().getFullYear();
    DB = {version:1, active:String(y), theme:(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light', years:{}};
    DB.years[String(y)] = blankYear(y);
  }
  if(!DB.years[DB.active]) DB.active = Object.keys(DB.years).sort()[0];
  ensureDB();
  Object.values(DB.years).forEach(migrate);
  Y = DB.years[DB.active];
  CUR = safeCur(Y.currency);
}
/* ---------- optional server sync ----------
   Self-hosting this (see homelab/) serves the page from a small server that also keeps
   your data as JSON, so the same data follows you between machines instead of living
   in one browser. That server marks its endpoint with an X-Penny-Keeper-Sync header, and
   nothing here turns on without it: opened from GitHub Pages, any other static host, or
   straight off disk, the probe below finds nothing, sync stays off, no status text
   appears and the page behaves exactly as it always has on localStorage alone.

   In that case the probe is also the only request the page ever makes - a GET to its own
   origin carrying no data - and no further ones follow. */
const SYNC_URL = 'data/penny-keeper-current.json';   // relative, so it holds up under a subpath
let syncOn = false, syncPushTimer = null, syncFailed = false;

async function initSync(){
  let res;
  try{ res = await fetch(SYNC_URL, {cache:'no-store'}); }
  catch(e){ return; }                                      // offline, file://, nothing listening
  if(res.headers.get('X-Penny-Keeper-Sync') !== '1') return;     // not a Penny Keeper server: say nothing, change nothing
  syncOn = true;
  if(res.status === 404){ setStatus('Sync on - nothing stored on the server yet'); return; }
  if(!res.ok){ setStatus('Sync on - server error, using the copy in this browser'); return; }
  let j;
  try{ j = await res.json(); }
  catch(e){ setStatus('Sync on - server copy would not parse, using this browser’s'); return; }
  if(!j || !j.years || typeof j.years!=='object' || !Object.keys(j.years).length){
    setStatus('Sync on - server copy was empty, using this browser’s'); return;
  }
  /* The server is the source of truth on load - last write wins, nothing is merged - so
     do not leave this open and editing on two machines at once. */
  DB = j;
  if(!DB.years[DB.active]) DB.active = Object.keys(DB.years).sort()[0];
  ensureDB();
  Object.values(DB.years).forEach(migrate);
  Y = DB.years[DB.active];
  CUR = safeCur(Y.currency);
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  applyTheme(); render({reset:true});
  setStatus('Loaded from the server');
}
function pushToServer(){
  if(!syncOn) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(()=>{
    fetch(SYNC_URL, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(DB)})
      .then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); syncFailed = false; })
      .catch(()=>{                                         // one warning, not one per keystroke
        if(!syncFailed) setStatus('Saved in this browser - the server did not take it');
        syncFailed = true;
      });
  }, 600);
}
/* Best effort on the way out: sendBeacon bodies are capped (~64KB) and a full backup can
   run past that, so the debounced push above is what carries most edits. */
function flushServerPush(){
  if(!syncOn) return;
  clearTimeout(syncPushTimer);
  try{ navigator.sendBeacon && navigator.sendBeacon(SYNC_URL, new Blob([JSON.stringify(DB)],{type:'application/json'})); }
  catch(e){}
}

/* Currency reaches the DOM through fmt() in a hundred places and year through
   headings and filenames, so neither is escaped at each use - they are normalised
   here instead, on the way in. */
function safeCur(v){
  const s = String(v==null?'\u20ac':v).replace(/[<>&"'`]/g,'').trim();
  return s.slice(0,3) || '\u20ac';
}
/* Runs on every year, from every entry point: startup, a JSON restore, a new-year
   roll-forward. A restored file can be any age or come from a hand-edited or partial
   export, so every field a render pass touches is defaulted here rather than assumed
   - the alternative is a render-time crash that gets mislabelled "won't parse" further
   up the chain, when the JSON parsed fine and the problem is a missing field. */
/* DB.years is keyed by a label rather than a bare year, so the same tax year can hold
   several scenarios ("2026", "2026-2"). y.year stays numeric because the tax presets
   key off it; y.label is what gets shown and used in filenames. */
function yearLabel(y){ const t = y||Y; return String(t.label || t.year || ''); }
function yearKey(label, exclude){
  let base = String(label||'').trim().replace(/[^\w \-.]/g,'').slice(0,24) || 'year';
  let k = base, n = 2;
  while(DB.years[k] && k!==exclude) k = base+'-'+(n++);
  return k;
}
function migrate(y){
  y.currency = safeCur(y.currency);
  y.year = parseInt(y.year,10) || new Date().getFullYear();
  if(!y.label) y.label = String(y.year);
  if(!Array.isArray(y.people)) y.people = [];
  if(!Array.isArray(y.bills)) y.bills = [];
  if(!Array.isArray(y.loans)) y.loans = [];
  if(!Array.isArray(y.rules)) y.rules = [];
  if(!Array.isArray(y.txns)) y.txns = [];
  if(!Array.isArray(y.history)) y.history = [];
  if(!y.savings || typeof y.savings!=='object') y.savings = {startDate:y.year+'-01-01', months:24, growthPct:0, accounts:[]};
  if(!Array.isArray(y.savings.accounts)) y.savings.accounts = [];
  if(!y.analysis || typeof y.analysis!=='object') y.analysis = {from:y.year+'-01-01', to:(y.year+1)+'-01-01'};
  if(!y.analysis.from) y.analysis.from = y.year+'-01-01';
  if(!y.analysis.to) y.analysis.to = (y.year+1)+'-01-01';
  if(!y.taxBands || typeof y.taxBands!=='object') y.taxBands = presetFor(y.year);
  if(!Array.isArray(y.taxBands.uscBands) || !y.taxBands.uscBands.length) y.taxBands.uscBands = presetFor(y.year).uscBands;
  y.people.forEach(p=>{ if(!Array.isArray(p.credits)) p.credits = []; if(!p.id) p.id = uid(); });
  if(y.energy && y.energy.summary) y.energy.summary.intervalMins = num(y.energy.summary.intervalMins)||30;
  y.bills.forEach(b=>{ if(!b.kind) b.kind = guessKind(b.name); });
  y.loans.forEach(l=>{ delete l.ppi; });                    // PPI never worked; removed
  if(!Array.isArray(y.mortgages)) y.mortgages = [];
  y.mortgages.forEach(m=>{
    if(!m.id) m.id = uid();
    if(!Array.isArray(m.rates)) m.rates = [];
    if(!Array.isArray(m.lumps)) m.lumps = [];
    if(!Array.isArray(m.statements)) m.statements = [];
    /* a rate with no date has no effect and never shows in the table, so it just sits
       there confusing the next person to look - drop it rather than keep a ghost row */
    m.rates = m.rates.filter(r=> r && r.from);
    m.rates.forEach(r=>{ if(!r.id) r.id = uid(); if(!RATE_KINDS[r.kind]) r.kind = 'variable'; });
    m.lumps.forEach(l=>{ if(!l.id) l.id = uid(); });
    m.statements.forEach(s=>{ if(!s.id) s.id = uid(); });
    m.termMonths = clamp(Math.round(num(m.termMonths)), 0, 1200);
    if(blankish(m.allowancePct)) m.allowancePct = 10;        // most Irish lenders allow 10% a year on a fix
    // mortgage protection and home insurance were separate fields; they are one line now
    if(blankish(m.insuranceMonthly)) m.insuranceMonthly = round2(num(m.lifeMonthly) + num(m.homeMonthly));
    delete m.lifeMonthly; delete m.homeMonthly;
    m.basis = basisOf(m);                                    // daily 1/365 unless told otherwise
  });
  if(!y.accounts) y.accounts = [];
  if(!y.payees) y.payees = [];
  if(!SPLIT_MODES[y.splitMode]) y.splitMode = 'income';
  if(!y.splitManual) y.splitManual = {};
  if(typeof y.lodgeIncludesSavings !== 'boolean') y.lodgeIncludesSavings = true;
  if(!y.energy) y.energy = blankEnergy();
  if(!y.energy.bands) y.energy.bands = blankEnergy().bands;
  if(y.energy.vat === undefined) y.energy.vat = 9;
  if(!y.energy.offers) y.energy.offers = [];
  if(y.energy.mprn === undefined) y.energy.mprn = (y.energy.summary && y.energy.summary.mprn) || '';
  if(!y.renewals) y.renewals = blankRenewals();
  if(!Array.isArray(y.renewals.items)) y.renewals.items = [];
  delete y.renewals.ntfy;                                   // dropped: see blankRenewals
  y.renewals.items.forEach(c=>{ if(!c.id) c.id = uid(); delete c.sent; });
  if(!y.maternity) y.maternity = blankMaternity();
  const mm = y.maternity;
  if(!mm.employerPhases){
    // fold the old single-policy fields into the first phase
    mm.employerPhases = (mm.employerMode && mm.employerMode!=='none' && num(mm.employerWeeks)>0)
      ? [{id:uid(), weeks:num(mm.employerWeeks), mode:mm.employerMode, amount:num(mm.employerAmount)}]
      : [];
    delete mm.employerMode; delete mm.employerWeeks; delete mm.employerAmount;
  }
  mm.employerPhases.forEach(p=>{ if(!EMPLOYER_MODES[p.mode]) p.mode='topup'; if(!p.id) p.id=uid(); });
  /* Imported JSON carries rules but bare transactions, which left the dashboard with no
     actuals. Only auto-run on a year that has never been categorised - once anything is
     categorised, a blank category is treated as a deliberate choice and left alone. */
  if((y.txns||[]).length && !(y.txns||[]).some(t=>t.category)) applyRules(false, y);
  migrateEasy(y);
}

function migrateEasy(y){
  if(!Array.isArray(y.goals)) y.goals = [];
  y.goals.forEach(g=>{ if(!g.id) g.id = uid(); });
  if(!y.emergency || typeof y.emergency!=='object') y.emergency = {months:3, saved:0};
  if(!num(y.emergency.months)) y.emergency.months = 3;
  if(!y.reliefs || typeof y.reliefs!=='object') y.reliefs = {};
  const r = y.reliefs;
  if(!Array.isArray(r.health)) r.health = [];
  r.health.forEach(h=>{ if(!h.id) h.id = uid(); });
  if(!r.checklist || typeof r.checklist!=='object') r.checklist = {};
  if(!r.remote || typeof r.remote!=='object') r.remote = {days:0, elec:0, heat:0, broadband:0, share:33};
  if(!r.tuition || typeof r.tuition!=='object') r.tuition = {eligible:0};
  if(!Array.isArray(r.tuitionClaims)) r.tuitionClaims = [];
  r.tuitionClaims.forEach(c=>{ if(!c.id) c.id = uid(); });
  /* tax-year figures added since older backups were made */
  const preset = presetFor(y.year);
  ['srcopParent','srcopSecond','earnedCredit','rentCredit','homeCarer','prsiExemptWeekly'].forEach(k=>{
    if(y.taxBands[k]===undefined) y.taxBands[k] = preset[k];
  });
  y.people.forEach(p=>{ if(!p.status) p.status = guessStatus(p, y.taxBands); });
  /* the disposable-income tracker */
  if(!y.disposable || typeof y.disposable!=='object') y.disposable = blankDisposable();
  const dp = y.disposable;
  if(!Array.isArray(dp.items)) dp.items = [];
  if(!Array.isArray(dp.entries)) dp.entries = [];
  dp.items.forEach(it=>{
    if(!it.id) it.id = uid();
    it.name = String(it.name||''); it.amount = num(it.amount);
    it.who = it.who ? String(it.who) : 'Joint';
    if(!FREQ[it.freq]) it.freq = 'Monthly';
  });
  dp.entries.forEach(e=>{
    if(!e.id) e.id = uid();
    e.date = String(e.date||''); e.what = String(e.what||''); e.amount = num(e.amount);
    e.who = e.who ? String(e.who) : 'Joint';
    if(!DISPOSABLE_CATS.some(c=>c[0]===e.category)) e.category = 'Other';
  });
}
/* ---------- IBAN ---------- */
function ibanClean(s){ return String(s||'').replace(/[\s-]/g,'').toUpperCase(); }
function ibanPretty(s){ return ibanClean(s).replace(/(.{4})/g,'$1 ').trim(); }
function ibanMask(s){
  const v = ibanClean(s);
  if(v.length < 8) return v ? '\u2022'.repeat(v.length) : '';
  return v.slice(0,4)+' '+'\u2022'.repeat(Math.max(0,v.length-8)).replace(/(.{4})/g,'$1 ').trim()+' '+v.slice(-4);
}
function ibanValid(s){
  const v = ibanClean(s);
  if(!/^[A-Z]{2}[0-9]{2}[A-Z0-9]{6,30}$/.test(v)) return false;
  const r = v.slice(4)+v.slice(0,4);
  const digits = r.replace(/[A-Z]/g, c=> c.charCodeAt(0)-55);
  let rem = 0;
  for(let i=0;i<digits.length;i++) rem = (rem*10 + (+digits[i])) % 97;
  return rem === 1;
}

/* ---------- electricity: HDF parsing, banding, tariff costing ---------- */
function bandFor(date, b){
  const h = date.getHours() + date.getMinutes()/60;
  const ns = num(b.nightStart), ne = num(b.nightEnd);
  const inNight = ns > ne ? (h >= ns || h < ne) : (h >= ns && h < ne);
  if(inNight) return 'night';
  const ps = num(b.peakStart), pe = num(b.peakEnd);
  const inPeak = ps > pe ? (h >= ps || h < pe) : (h >= ps && h < pe);
  return inPeak ? 'peak' : 'day';
}
function parseHDFDate(s){
  const m = String(s||'').trim().match(/^(\d{2})-(\d{2})-(\d{4})[ T](\d{2}):(\d{2})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
/* Reads are the END of each interval and the value is average kW over it, so the
   interval that ends at 08:00 is 07:30-08:00 and belongs to the night band. */
function summariseUsage(text, bands){
  const lines = String(text).split(/\r?\n/);
  const head = (lines[0]||'').split(',').map(h=>h.trim().toLowerCase());
  const iVal = head.findIndex(h=>h.includes('read value'));
  const iType = head.findIndex(h=>h.includes('read type'));
  const iDate = head.findIndex(h=>h.includes('read date'));
  const iMprn = head.findIndex(h=>h.includes('mprn'));
  if(iVal<0 || iDate<0) return {error:'Need "Read Value" and "Read Date and End Time" columns - this should be the HDF file from ESB Networks.'};

  const pts = [];
  let mprn = '', skipped = 0;
  for(let i=1;i<lines.length;i++){
    const ln = lines[i]; if(!ln) continue;
    const c = ln.split(',');
    const type = iType>=0 ? (c[iType]||'') : 'kW';
    if(!/import/i.test(type) && iType>=0){ skipped++; continue; }
    const d = parseHDFDate(c[iDate]);
    const v = parseFloat(c[iVal]);
    if(!d || !isFinite(v)){ skipped++; continue; }
    if(!mprn && iMprn>=0) mprn = (c[iMprn]||'').trim();
    pts.push([d.getTime(), v, /kwh/i.test(type)]);
  }
  if(pts.length < 48) return {error:'Only '+pts.length+' readings found - that is not enough to summarise.'};
  pts.sort((a,b)=>a[0]-b[0]);

  // interval length from the most common gap between consecutive reads
  const gaps = {};
  for(let i=1;i<Math.min(pts.length,600);i++){
    const g = (pts[i][0]-pts[i-1][0])/60000;
    if(g>0 && g<=120) gaps[g] = (gaps[g]||0)+1;
  }
  const mins = +Object.keys(gaps).sort((a,b)=>gaps[b]-gaps[a])[0] || 30;
  const hours = mins/60;

  // window: the last 12 complete calendar months
  const last = new Date(pts[pts.length-1][0]);
  const endEx = new Date(last.getFullYear(), last.getMonth(), 1);      // start of the incomplete month
  const start = new Date(endEx.getFullYear(), endEx.getMonth()-12, 1);
  const first = new Date(pts[0][0]);
  const from = start < first ? new Date(first.getFullYear(), first.getMonth()+ (first.getDate()>1?1:0), 1) : start;

  const months = {};
  const slotN = Math.max(1, Math.round(1440/mins));
  const slotSum = new Array(slotN).fill(0), slotCnt = new Array(slotN).fill(0);
  let day=0, night=0, peak=0, used=0;
  for(const [t,v,isKwh] of pts){
    const end = new Date(t);
    const st = new Date(t - mins*60000);
    if(st < from || st >= endEx) continue;
    const kwh = isKwh ? v : v*hours;
    const b = bandFor(st, bands);
    const k = monthKey(st);
    const m = months[k] || (months[k] = {month:k, day:0, night:0, peak:0, total:0});
    m[b] += kwh; m.total += kwh;
    if(b==='day') day+=kwh; else if(b==='night') night+=kwh; else peak+=kwh;
    const si = Math.floor((st.getHours()*60 + st.getMinutes())/mins) % slotN;
    slotSum[si] += kwh; slotCnt[si]++;
    used++;
  }
  if(!used) return {error:'No readings fell inside the last complete year.'};
  const keys = Object.keys(months).sort();
  const r2 = n => Math.round(n*100)/100;
  return {
    mprn, from: iso(from), to: iso(new Date(endEx-86400000)),
    months: keys.length,
    intervals: used, intervalMins: mins,
    day: r2(day), night: r2(night), peak: r2(peak), total: r2(day+night+peak),
    byMonth: keys.map(k=>({month:k, day:r2(months[k].day), night:r2(months[k].night),
                            peak:r2(months[k].peak), total:r2(months[k].total)})),
    profile: slotSum.map((v,i)=> slotCnt[i] ? Math.round(v/slotCnt[i]*1000)/1000 : 0),
    importedAt: iso(new Date())
  };
}
/* Cost a tariff against the summarised year. Rates are cent per kWh. */
function offerCost(o, sum, vatPct){
  if(!sum) return null;
  const c = v => num(v)/100;
  const units = sum.day*c(o.day) + sum.night*c(o.night) + sum.peak*c(o.peak);
  const disc = units * (num(o.discount)/100);
  const standing = num(o.standing);
  let total = units - disc + standing;
  const vat = o.incVat ? 0 : total*(num(vatPct)/100);
  total += vat;
  const scale = sum.months ? 12/sum.months : 1;     // normalise a short window to a year
  return {
    units: units-disc, standing, vat, discount:disc,
    annual: total*scale, monthly: total*scale/12,
    dayCost: sum.day*c(o.day), nightCost: sum.night*c(o.night), peakCost: sum.peak*c(o.peak),
    effective: sum.total ? (total/sum.total)*100 : 0
  };
}

/* ---------- tax engine ---------- */
function uscFor(income, bands, exempt){
  if(income <= exempt) return 0;
  let prev=0, total=0;
  for(const b of bands){
    if(income > prev){ total += (Math.min(income,b.to)-prev)*b.rate; prev=b.to; }
  }
  return total;
}
function calcTax(person, bands){
  const p = person, b = bands;
  const gross = num(p.gross);
  const bik = num(p.bikMonthly)*12;
  const pension = gross*(num(p.pensionPct)/100);
  const avc = num(p.avcMonthly)*12;
  const grossPay = gross + bik;                       // incl. notional pay
  const taxable = grossPay - pension - avc;
  const srcop = effectiveSrcop(p, b);                 // the band that applies to this person
  const taxOn = x => Math.max(Math.min(x, srcop),0)*b.lowRate + Math.max(x - srcop, 0)*b.highRate;
  const tax20 = Math.max(Math.min(taxable, srcop),0) * b.lowRate;
  const tax40 = Math.max(taxable - srcop, 0) * b.highRate;
  const liability = tax20 + tax40;
  /* credits that are in your pay reduce the tax taken each month; the ones that are claimed after the year
     ends (rent, mortgage interest) are worked out separately as a refund, not in take-home pay */
  const credits = (p.credits||[]).filter(c=>!creditIsRefund(c)).reduce((s,c)=>s+num(c.amount),0);
  const refundCredits = (p.credits||[]).filter(creditIsRefund).reduce((s,c)=>s+num(c.amount),0);
  const paye = Math.max(liability - credits, 0);
  const refund = paye - Math.max(liability - credits - refundCredits, 0);   // a credit cannot refund more tax than was paid
  const m1 = clamp(num(b.prsiChangeMonth)-1, 0, 12), m2 = 12-m1;
  /* employees earning at or under the weekly threshold pay no PRSI at all */
  const prsiOn = x => (x/52 <= num(b.prsiExemptWeekly)) ? 0 : (x*b.prsiRate1/12)*m1 + (x*b.prsiRate2/12)*m2;
  const prsi = prsiOn(grossPay);
  const usc = uscFor(grossPay, b.uscBands, b.uscExempt);
  const deductions = paye + prsi + usc + pension + avc;
  const net = gross - deductions;
  /* a bonus is the extra tax on top of normal pay, so one that straddles the band is split correctly */
  const bonus = num(p.bonus);
  const bTax = Math.max(taxOn(taxable + bonus) - credits, 0) - paye;
  const bPrsi = prsiOn(grossPay + bonus) - prsi;
  const bUsc = uscFor(grossPay + bonus, b.uscBands, b.uscExempt) - usc;
  const bonusNet = bonus - bTax - bPrsi - bUsc;
  return {gross, bik, pension, avc, grossPay, taxable, tax20, tax40, liability, credits, refundCredits, refund, paye,
          prsi, usc, deductions, net, netMonthly:net/12, srcop,
          bonus, bTax, bPrsi, bUsc, bonusNet,
          effective: grossPay? (paye+prsi+usc)/grossPay*100 : 0};
}


function guessStatus(p, bands){
  const s = num(p.srcop);
  if(!s || s===num(bands.srcopSingle)) return 'single';
  if(s===num(bands.srcopMax)) return 'married1';
  if(bands.srcopParent && s===num(bands.srcopParent)) return 'parent';
  return 'custom';
}

/* is the saved year's tax setup different from the figures built in for that year? */
function taxBandsDiffer(b, p){
  const keys = ['srcopSingle','srcopMax','srcopParent','srcopSecond','lowRate','highRate','prsiRate1','prsiRate2','prsiChangeMonth','prsiExemptWeekly','uscExempt'];
  if(keys.some(k=> num(b[k]) !== num(p[k]))) return true;
  const a = (b.uscBands||[]).map(x=>[num(x.to), num(x.rate)].join(':')).join('|');
  return a !== p.uscBands.map(x=>[x.to, x.rate].join(':')).join('|');
}

/* the personal credit that should be on this person's list, and a note if what they have is different */
function personalCheck(p){
  const type = p.personalType || defaultPersonalType(p.status);

  const row = (p.credits||[]).find(c=>/^personal/i.test(c.name));
  if(p.status==='custom') return null;

  if(Math.abs(num(row.amount)-want) > 0.5) return {want, have:num(row.amount), label:PERSONAL_TYPES[type].label};
  return null;
}

/* "What does next year's Budget mean for me?" - the same salary run through next year's published
   figures: new rate bands, credits and USC bands. Only offered when those figures are built in. */
function nextYearPerson(p, ny, nb){
